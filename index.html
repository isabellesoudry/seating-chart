<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Seating Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf7f2;
  --warm-white: #fff9f0;
  --sage: #7a9e7e;
  --dusty-rose: #c4837a;
  --gold: #c9a84c;
  --deep: #2c2416;
  --mid: #6b5c3e;
  --light: #e8dcc8;
  --table-bg: #2c6e8a;
  --table-hover: #1e5470;
  --chair-color: #2c6e8a;
  --chair-seated: #7a9e7e;
  --chair-female: #e8889a;
  --chair-female-seated: #d4607a;
  --chair-male: #6aaac8;
  --chair-male-seated: #3d85ab;
  --shadow: 0 4px 24px rgba(44,36,22,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--deep);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: var(--warm-white);
  border-bottom: 1px solid var(--light);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 100;
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  color: var(--deep);
  font-style: italic;
}
.stats {
  display: flex;
  gap: 20px;
  font-size: 0.78rem;
  color: var(--mid);
}
.stat span { font-weight: 600; color: var(--deep); }
.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* LEFT PANEL */
.guest-panel {
  width: 190px;
  background: var(--warm-white);
  border-right: 1px solid var(--light);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width 0.22s ease;
}
.guest-panel.collapsed { width: 28px; }
.guest-panel.collapsed .search-box,
.guest-panel.collapsed .filter-tabs,
.guest-panel.collapsed .guest-list { display: none; }
.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--light);
  background: var(--cream);
  position: relative;
}
.panel-toggle-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  background: none;
  border: 1px solid var(--light);
  border-radius: 4px;
  cursor: pointer;
  color: var(--mid);
  font-size: 0.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, color 0.12s;
  flex-shrink: 0;
  line-height: 1;
  padding: 0;
}
.panel-toggle-btn:hover { background: var(--light); color: var(--deep); }
.guest-panel .panel-toggle-btn { right: 8px; }
.detail-panel .panel-toggle-btn { left: 8px; }
/* Collapsed state — show only a thin strip with toggle button */
.guest-panel.collapsed .panel-header,
.detail-panel.collapsed .panel-header {
  padding: 8px 4px;
  border-bottom: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  height: 100%;
  overflow: hidden;
}
.guest-panel.collapsed .panel-header h2,
.detail-panel.collapsed .panel-header h2 {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 0.62rem;
  margin: 0;
  white-space: nowrap;
  color: var(--mid);
  letter-spacing: 0.1em;
}
.guest-panel.collapsed .panel-toggle-btn,
.detail-panel.collapsed .panel-toggle-btn {
  position: static;
  transform: none;
}
.panel-header h2 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--mid);
  margin-bottom: 8px;
  font-weight: 500;
}
.search-box {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--light);
  border-radius: 6px;
  background: var(--warm-white);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--deep);
  outline: none;
}
.search-box:focus { border-color: var(--sage); }
.filter-tabs {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}
.filter-tab {
  flex: 1;
  padding: 4px 0;
  font-size: 0.7rem;
  border: 1px solid var(--light);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  color: var(--mid);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.filter-tab.active { background: var(--deep); color: white; border-color: var(--deep); }
.guest-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.guest-item {
  padding: 7px 16px;
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-left: 3px solid transparent;
  transition: all 0.12s;
  user-select: none;
}
.guest-item:hover { background: var(--light); border-left-color: var(--gold); }
.guest-item.seated { opacity: 0.45; }
.guest-item.dragging { opacity: 0.3; }
.guest-name { font-size: 0.82rem; font-weight: 500; color: var(--deep); }
.guest-meta { font-size: 0.68rem; color: var(--mid); }
.diet-badge {
  display: inline-block;
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--light);
  color: var(--mid);
  margin-top: 2px;
}
.diet-badge.veg { background: #d4edda; color: #2d6a4f; }
.diet-badge.allergy { background: #fff3cd; color: #856404; }

/* FLOOR PLAN */
.floor-plan-area {
  flex: 1;
  overflow: hidden;
  background: var(--cream);
  position: relative;
  cursor: grab;
  user-select: none;
}
.floor-plan-area.panning { cursor: grabbing; }
.floor-viewport {
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: relative;
}
.floor-container {
  position: absolute;
  width: 1660px;
  height: 840px;
  background: var(--warm-white);
  border: 1px solid var(--light);
  border-radius: 12px;
  box-shadow: var(--shadow);
  transform-origin: 0 0;
}
/* Zoom controls */
.zoom-controls {
  position: absolute;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 50;
}
.zoom-btn {
  width: 32px;
  height: 32px;
  background: var(--warm-white);
  border: 1px solid var(--light);
  border-radius: 6px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--deep);
  font-weight: 500;
  transition: background 0.12s;
  line-height: 1;
}
.zoom-btn:hover { background: var(--light); }
.zoom-level {
  width: 32px;
  height: 24px;
  background: var(--warm-white);
  border: 1px solid var(--light);
  border-radius: 6px;
  font-size: 0.6rem;
  color: var(--mid);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Sans', sans-serif;
}

/* Seat count labels */
.seat-count-label {
  position: absolute;
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--mid);
  font-family: 'DM Sans', sans-serif;
}

/* Dancefloor */
.dancefloor {
  position: absolute;
  background: linear-gradient(160deg, #d4a574 0%, #c49060 40%, #b8844e 100%);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
}
.dj-booth {
  position: absolute;
  background: var(--table-bg);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.05em;
}
.entrance-marker {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.entrance-arrow {
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 14px solid var(--deep);
}
.entrance-label {
  font-size: 0.65rem;
  color: var(--mid);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* TABLE GROUP — absolutely positioned wrapper */
.table-group {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* The table rectangle */
.table-rect {
  background: var(--table-bg);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-align: center;
  padding: 0 8px;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.table-rect:hover { background: var(--table-hover); }

/* Middle row: optional side seats + table */
.table-mid-row {
  display: flex;
  align-items: center;
  width: 100%;
}

/* Seat rows */
.seats-row {
  display: flex;
  gap: 2px;
  justify-content: center;
  width: 100%;
}

/* SEAT */
.seat {
  width: 34px;
  height: 34px;
  background: var(--chair-color);
  opacity: 0.85;
  cursor: grab;
  transition: all 0.15s;
  position: relative;
  flex-shrink: 0;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}
/* Chair shape per side */
.seat[data-side="top"]    { border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%; }
.seat[data-side="bottom"] { border-radius: 40% 40% 50% 50% / 40% 40% 60% 60%; }
.seat[data-side="left"]   { border-radius: 60% 40% 40% 60% / 50% 50% 50% 50%; }
.seat[data-side="right"]  { border-radius: 40% 60% 60% 40% / 50% 50% 50% 50%; }

.seat.occupied { background: var(--chair-seated); opacity: 1; cursor: grab; }
.seat.female { background: var(--chair-female); opacity: 0.85; }
.seat.male   { background: var(--chair-male);   opacity: 0.85; }
.seat.female.occupied { background: var(--chair-female-seated); opacity: 1; }
.seat.male.occupied   { background: var(--chair-male-seated);   opacity: 1; }
.seat.highlight { border-color: var(--gold); transform: scale(1.15); opacity: 1; }
.seat:hover { opacity: 1; transform: scale(1.1); border-color: var(--gold); }
.seat.drop-target { border-color: var(--sage); transform: scale(1.2); opacity: 1; background: var(--sage); }
.seat.dragging-out { opacity: 0.35; }

.seat-initials {
  font-size: 7px;
  font-weight: 700;
  color: white;
  letter-spacing: -0.3px;
  line-height: 1.1;
  pointer-events: none;
  user-select: none;
  text-align: center;
  position: absolute;
  padding: 1px 2px;
  max-width: 32px;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: normal;
}
.seat-tooltip {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--deep);
  color: white;
  font-size: 0.68rem;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 200;
  pointer-events: none;
}
.seat-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-top-color: var(--deep);
}
.seat:hover .seat-tooltip { display: block; }

/* CONTEXT MENU */
.context-menu {
  position: fixed;
  background: white;
  border: 1px solid var(--light);
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  padding: 4px 0;
  z-index: 1000;
  min-width: 160px;
  display: none;
}
.context-menu.visible { display: block; }
.context-menu-title {
  padding: 6px 14px;
  font-size: 0.7rem;
  color: var(--mid);
  border-bottom: 1px solid var(--light);
  font-style: italic;
}
.context-item {
  padding: 7px 14px;
  font-size: 0.78rem;
  cursor: pointer;
  color: var(--deep);
  transition: background 0.1s;
}
.context-item:hover { background: var(--light); }
.context-item.danger { color: var(--dusty-rose); }

/* DRAG GHOST */
.drag-ghost {
  position: fixed;
  background: var(--deep);
  color: white;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.72rem;
  pointer-events: none;
  z-index: 9999;
  display: none;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

/* RIGHT PANEL */
.detail-panel {
  width: 170px;
  background: var(--warm-white);
  border-left: 1px solid var(--light);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width 0.22s ease;
}
.detail-panel.collapsed { width: 28px; }
.detail-panel.collapsed .detail-content { display: none; }
.detail-content { flex: 1; overflow-y: auto; }
.detail-placeholder {
  padding: 20px 16px;
  text-align: center;
  color: var(--mid);
  font-size: 0.78rem;
  font-style: italic;
}
.table-detail-header {
  padding: 10px 16px;
  background: var(--table-bg);
  color: white;
}
.table-detail-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 0.9rem;
}
.table-detail-header p { font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }
.seated-list { padding: 8px 0; }
.seated-person {
  padding: 5px 16px;
  font-size: 0.75rem;
  color: var(--deep);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.seated-person .remove-btn {
  background: none; border: none;
  cursor: pointer;
  color: var(--dusty-rose);
  font-size: 0.85rem;
  line-height: 1; opacity: 0.6;
  transition: opacity 0.1s;
}
.seated-person .remove-btn:hover { opacity: 1; }
.seat-num {
  font-size: 0.65rem; color: var(--mid);
  background: var(--light);
  border-radius: 3px; padding: 1px 4px;
  flex-shrink: 0;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--light); border-radius: 2px; }
.guest-section-header {
  padding: 4px 16px 2px;
  font-size: 0.63rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gold);
  background: var(--cream);
  border-top: 1px solid var(--light);
  font-weight: 600;
}
</style>
</head>
<body>

<header>
  <h1>✦ Wedding Seating Chart</h1>
  <div class="stats">
    <div>Guests: <span id="total-guests">0</span></div>
    <div>Seated: <span id="seated-count">0</span></div>
    <div>Unseated: <span id="unseated-count">0</span></div>
  </div>
  <div style="font-size:0.72rem;color:var(--mid);">Drag guests → seats &nbsp;•&nbsp; Right-click seat to remove</div>
</header>

<div class="app-body">
  <!-- LEFT: Guest List -->
  <div class="guest-panel">
    <div class="panel-header">
      <h2>Guest List</h2>
      <button class="panel-toggle-btn" id="toggleGuestPanel" title="Collapse panel">&#8249;</button>
      <input class="search-box" type="text" placeholder="Search guests…" id="guestSearch">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="unseated">Unseated</button>
        <button class="filter-tab" data-filter="seated">Seated</button>
      </div>
    </div>
    <div class="guest-list" id="guestList"></div>
  </div>

  <!-- CENTER: Floor Plan -->
  <div class="floor-plan-area" id="floorPlanArea">
    <div class="floor-viewport" id="floorViewport">
      <div class="floor-container" id="floorContainer">
        <!-- Static room elements -->
        <div class="dancefloor" style="left:620px;top:230px;width:380px;height:310px;">Dancefloor</div>
        <div class="dj-booth" style="left:620px;top:640px;width:190px;height:46px;">DJ</div>
        <div class="entrance-marker" style="left:860px;top:634px;">
          <div class="entrance-arrow"></div>
          <div class="entrance-label">Entrance</div>
        </div>
        <!-- Tables injected by JS -->
      </div>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
      <div class="zoom-level" id="zoomLevel">100%</div>
      <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
      <button class="zoom-btn" id="zoomReset" title="Reset zoom" style="font-size:0.7rem;">⌂</button>
    </div>
  </div>

  <!-- RIGHT: Table Detail -->
  <div class="detail-panel">
    <div class="panel-header">
      <button class="panel-toggle-btn" id="toggleDetailPanel" title="Collapse panel">&#8250;</button>
      <h2>Table Detail</h2>
    </div>
    <div class="detail-content" id="detailContent">
      <div class="detail-placeholder">Click a table to see seated guests</div>
    </div>
  </div>
</div>

<div class="drag-ghost" id="dragGhost"></div>
<div class="context-menu" id="contextMenu">
  <div class="context-menu-title" id="contextMenuTitle">Seat</div>
  <div class="context-item danger" id="contextRemove">Remove guest</div>
</div>

// ============================================================
// TABLE LAYOUT — matched precisely to the image
//
// Each table definition:
//   id, label, pos {left, top} = top-left of the entire group
//   tableW: width of the actual table rectangle
//   tableH: height of the table rectangle
//   topSeats: number of seats above the table
//   botSeats: number of seats below the table
//   leftSeats: number of seats on the left end (Table 3 only)
//   rightSeats: number of seats on the right end (Table 3 only)
//
// Seat indexing order: top row L→R, then left side T→B, then right side T→B, then bottom row L→R
// ============================================================

// SEAT_SIZE and GAP affect spacing
const SEAT_SIZE = 34;
const SEAT_GAP  = 3;

// Each seat row width = count * SEAT_SIZE + (count-1) * SEAT_GAP
// T1: 17 * 34 + 16 * 3 = 578 + 48 = 626px wide
// T2: 5  * 34 + 4  * 3 = 170 + 12 = 182px wide
// T3: 13 * 34 + 12 * 3 = 442 + 36 = 478px wide (+ side seats)

// T6: 8  * 34 + 7  * 3 = 272 + 21 = 293px wide (12 named guests)
// T7: 12 * 34 + 11 * 3 = 408 + 33 = 441px wide
// T8: 12 * 34 + 11 * 3 = 408 + 33 = 441px wide
//
// Layout (matching image):
// Left column:  T2 top-left, T3 mid-left, T4 lower-left, T5 bottom-left
// Center-top:   T1 head table spanning center
// Right column: T6 top-right, T7 mid-right, T8 lower-right
// Center:       Dancefloor, DJ, Entrance
//
// Canvas width must fit: left col (~480) + center gap + right col (~450) = ~1600px
// We'll use 1650px wide, 820px tall

TABLES.forEach(t => {
  const total = t.topSeats + t.botSeats + (t.leftSeats||0) + (t.rightSeats||0);
  for (let i = 0; i < total; i++) seatingState[`${t.id}-${i}`] = null;

  id: `g${i}`,
  name: `${g.first} ${g.last}`,

// ============================================================
// BUILD FLOOR — render all tables onto #floorContainer
// ============================================================
function buildFloor() {
  const container = document.getElementById('floorContainer');

  TABLES.forEach(t => {
    const topCount   = t.topSeats;
    const botCount   = t.botSeats;
    const leftCount  = t.leftSeats  || 0;
    const rightCount = t.rightSeats || 0;

    // Total seat width for top/bottom rows
    const rowSeatWidth = topCount * SEAT_SIZE + (topCount - 1) * SEAT_GAP;
    // Total width of the mid row: [leftSeat?] + table + [rightSeat?]
    const midTotalWidth = t.tableW + (leftCount > 0 ? SEAT_SIZE + 4 : 0) + (rightCount > 0 ? SEAT_SIZE + 4 : 0);
    // Wrapper width = max of row width and mid width
    const wrapperW = Math.max(rowSeatWidth, midTotalWidth);

    const wrapper = document.createElement('div');
    wrapper.className = 'table-group';
    wrapper.style.left = t.pos.left + 'px';
    wrapper.style.top  = t.pos.top  + 'px';
    wrapper.style.width = wrapperW + 'px';
    wrapper.dataset.tableId = t.id;

    let seatIdx = 0;

    // ── TOP ROW ──
    const topRow = document.createElement('div');
    topRow.className = 'seats-row';
    topRow.style.marginBottom = '3px';
    // Inset top/bottom rows to align under the table portion (not over side seats)
    if (leftCount > 0 || rightCount > 0) {
      const inset = leftCount > 0 ? SEAT_SIZE + 4 : 0;
      topRow.style.paddingLeft  = (leftCount > 0 ? SEAT_SIZE + 4 : 0) + 'px';
      topRow.style.paddingRight = (rightCount > 0 ? SEAT_SIZE + 4 : 0) + 'px';
    }
    for (let i = 0; i < topCount; i++) {
      topRow.appendChild(makeSeat(t.id, seatIdx++, 'top'));
    }
    wrapper.appendChild(topRow);

    // ── MID ROW: [left seat] + table rect + [right seat] ──
    const midRow = document.createElement('div');
    midRow.className = 'table-mid-row';
    midRow.style.gap = '4px';

    if (leftCount > 0) {
      for (let i = 0; i < leftCount; i++) {
        const ls = makeSeat(t.id, seatIdx++, 'left');
        ls.style.flexShrink = '0';
        midRow.appendChild(ls);
      }
    }

    const tableRect = document.createElement('div');
    tableRect.className = 'table-rect';
    tableRect.style.width = t.tableW + 'px';
    tableRect.style.height = (t.tableH || 38) + 'px';
    tableRect.style.flexShrink = '0';
    tableRect.textContent = t.label;
    tableRect.addEventListener('click', () => showTableDetail(t.id));
    midRow.appendChild(tableRect);

    if (rightCount > 0) {
      for (let i = 0; i < rightCount; i++) {
        const rs = makeSeat(t.id, seatIdx++, 'right');
        rs.style.flexShrink = '0';
        midRow.appendChild(rs);
      }
    }

    wrapper.appendChild(midRow);

    // ── BOTTOM ROW ──
    if (botCount > 0) {
      const botRow = document.createElement('div');
      botRow.className = 'seats-row';
      botRow.style.marginTop = '3px';
      if (leftCount > 0 || rightCount > 0) {
        botRow.style.paddingLeft  = (leftCount > 0 ? SEAT_SIZE + 4 : 0) + 'px';
        botRow.style.paddingRight = (rightCount > 0 ? SEAT_SIZE + 4 : 0) + 'px';
      }
      for (let i = 0; i < botCount; i++) {
        botRow.appendChild(makeSeat(t.id, seatIdx++, 'bottom'));
      }
      wrapper.appendChild(botRow);
    }

    // Kids Corner note label
    if (t.note) {
      const noteEl = document.createElement('div');
      noteEl.style.cssText = 'font-size:0.58rem;color:#bbb;text-align:right;margin-top:2px;font-style:italic;';
      noteEl.textContent = t.note;
      wrapper.appendChild(noteEl);
    }

    container.appendChild(wrapper);
  });

  // Seat count labels in left margin (matching image numbers)
  const labelData = [
    { id: 't1', text: '34', side: 'top' },
    { id: 't2', text: '10', side: 'left' },
    { id: 't3', text: '26', side: 'left' },
    { id: 't4', text: '23', side: 'left' },
    { id: 't5', text: '16', side: 'left' },
    { id: 't7', text: '24', side: 'right' },
    { id: 't8', text: '24', side: 'right' },
  ];
  labelData.forEach(ld => {
    const tbl = TABLES.find(t => t.id === ld.id);
    if (!tbl) return;
    const lbl = document.createElement('div');
    lbl.className = 'seat-count-label';
    lbl.textContent = ld.text;
    // Position roughly to the left of each table group
    if (ld.side === 'left') {
      lbl.style.left = (tbl.pos.left - 22) + 'px';
      lbl.style.top  = (tbl.pos.top + tbl.tableH / 2 + SEAT_SIZE + 3) + 'px';
    } else if (ld.side === 'right') {
      lbl.style.left = (tbl.pos.left - 22) + 'px';
      lbl.style.top  = (tbl.pos.top + tbl.tableH / 2 + SEAT_SIZE + 3) + 'px';
    } else {
      // top label above table 1
      lbl.style.left = (tbl.pos.left + tbl.tableW / 2) + 'px';
      lbl.style.top  = (tbl.pos.top - 14) + 'px';
    }
    document.getElementById('floorContainer').appendChild(lbl);
  });
}

function makeSeat(tableId, idx, side) {
  const seat = document.createElement('div');
  seat.className = 'seat';
  seat.dataset.side = side;
  seat.dataset.tableId = tableId;
  seat.dataset.seatIdx = idx;
  seat.id = `seat-${tableId}-${idx}`;

  const initialsEl = document.createElement('span');
  initialsEl.className = 'seat-initials';
  seat.appendChild(initialsEl);

  const tooltip = document.createElement('div');
  tooltip.className = 'seat-tooltip';
  tooltip.textContent = 'Empty';
  seat.appendChild(tooltip);

  // Drag FROM seat
  seat.addEventListener('dragstart', e => {
    const seatKey = `${tableId}-${idx}`;
    const gId = seatingState[seatKey];
    if (!gId) { e.preventDefault(); return; }
    dragGuestId = gId;
    dragSourceSeatKey = seatKey;
    dropHandled = false;
    seat.classList.add('dragging-out');
    const g = guests.find(x => x.id === gId);
    const ghost = document.getElementById('dragGhost');
    ghost.textContent = g.name;
    ghost.style.display = 'block';
    e.dataTransfer.effectAllowed = 'move';
  });
  seat.addEventListener('dragend', () => {
    seat.classList.remove('dragging-out');
    document.getElementById('dragGhost').style.display = 'none';
    // Only remove if no valid drop target received the guest
    if (!dropHandled && dragSourceSeatKey) {
      removeGuestFromSeat(dragSourceSeatKey);
    }
    dragGuestId = null;
    dragSourceSeatKey = null;
    dropHandled = false;
  });

  // Make seat draggable only when occupied
  seat.draggable = true;

  // Drop FROM guest list or another seat
  seat.addEventListener('dragover', e => { e.preventDefault(); seat.classList.add('drop-target'); });
  seat.addEventListener('dragleave', () => seat.classList.remove('drop-target'));
  seat.addEventListener('drop', e => {
    e.preventDefault();
    seat.classList.remove('drop-target');
    if (dragGuestId) {
      dropHandled = true;
      assignGuestToSeat(dragGuestId, `${tableId}-${idx}`);
    }
  });

  // Right click still works as fallback
  seat.addEventListener('contextmenu', e => {
    e.preventDefault();
    const seatKey = `${tableId}-${idx}`;
    const gId = seatingState[seatKey];
    if (gId) showContextMenu(e, seatKey, gId);
  });

  return seat;
}

// ============================================================
// RENDER GUEST LIST
// ============================================================
function renderGuestList() {
  const list = document.getElementById('guestList');
  list.innerHTML = '';

  const filtered = guests.filter(g => {
    const matchSearch = g.name.toLowerCase().includes(searchTerm.toLowerCase());
    const matchFilter = activeFilter === 'all' ? true :
      activeFilter === 'seated' ? g.seated : !g.seated;
    return matchSearch && matchFilter;
  });

  // Group by suggested table
  const byTable = {};
  filtered.forEach(g => {
    if (!byTable[g.suggestedTable]) byTable[g.suggestedTable] = [];
    byTable[g.suggestedTable].push(g);
  });

  Object.entries(byTable).forEach(([tableName, gs]) => {
    const header = document.createElement('div');
    header.className = 'guest-section-header';
    header.textContent = tableName.replace('Table ', 'T').replace(' - ', ' – ');
    list.appendChild(header);

    gs.forEach(g => {
      const item = document.createElement('div');
      item.className = 'guest-item' + (g.seated ? ' seated' : '');
      item.draggable = true;
      item.dataset.guestId = g.id;

      const isVeg = g.meal.includes('Vegetarian');
      const hasAllergy = g.diet.toLowerCase().includes('allerg') ||
        g.diet.toLowerCase().includes('anaphylactic') ||
        g.diet.toLowerCase().includes('intolerance') ||
        g.diet.toLowerCase().includes('free');

      item.innerHTML = `
        <div class="guest-name">${g.name}</div>
        <div class="guest-meta">${g.seated ? '✓ Seated' : 'Unseated'}</div>
        ${g.diet ? `<span class="diet-badge ${isVeg?'veg':''} ${hasAllergy?'allergy':''}">${g.diet}</span>` : ''}
      `;

      item.addEventListener('dragstart', e => {
        dragGuestId = g.id;
        dragSourceSeatKey = null;
        dropHandled = false;
        item.classList.add('dragging');
        const ghost = document.getElementById('dragGhost');
        ghost.textContent = g.name;
        ghost.style.display = 'block';
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.getElementById('dragGhost').style.display = 'none';
        if (!dropHandled) {
          dragGuestId = null;
        }
        dropHandled = false;
      });

      list.appendChild(item);
    });
  });

  // Update stats
  const seatedCount = guests.filter(g => g.seated).length;
  document.getElementById('total-guests').textContent = guests.length;
  document.getElementById('seated-count').textContent = seatedCount;
  document.getElementById('unseated-count').textContent = guests.length - seatedCount;
}

// ============================================================
// ASSIGN / REMOVE GUESTS
// ============================================================
function assignGuestToSeat(guestId, seatKey) {
  const guest = guests.find(g => g.id === guestId);
  if (!guest) return;

  // Remember old seat so we can clear it
  const oldSeatKey = guest.seatKey;

  // Remove guest from their previous seat
  if (oldSeatKey && oldSeatKey !== seatKey) {
    seatingState[oldSeatKey] = null;
    guest.seated = false;
    guest.seatKey = null;
  }

  // If target seat already occupied, unseat that guest first
  const existingGuestId = seatingState[seatKey];
  if (existingGuestId && existingGuestId !== guestId) {
    const existingGuest = guests.find(g => g.id === existingGuestId);
    if (existingGuest) {
      existingGuest.seated = false;
      existingGuest.seatKey = null;
    }
  }

  // Place the guest
  seatingState[seatKey] = guestId;
  guest.seated = true;
  guest.seatKey = seatKey;

  // Refresh UI for affected seats
  if (oldSeatKey && oldSeatKey !== seatKey) refreshSeatUI(oldSeatKey);
  refreshSeatUI(seatKey);
  renderGuestList();
  if (activeTableId) showTableDetail(activeTableId);
}

function removeGuestFromSeat(seatKey) {
  const gId = seatingState[seatKey];
  if (!gId) return;
  const guest = guests.find(g => g.id === gId);
  if (guest) { guest.seated = false; guest.seatKey = null; }
  seatingState[seatKey] = null;
  refreshSeatUI(seatKey);
  renderGuestList();
  if (activeTableId) showTableDetail(activeTableId);
}

function refreshSeatUI(seatKey) {
  const [tableId, idx] = seatKey.split('-');
  const seatEl = document.getElementById(`seat-${tableId}-${idx}`);
  if (!seatEl) return;
  const gId = seatingState[seatKey];
  const initialsEl = seatEl.querySelector('.seat-initials');
  const tooltip = seatEl.querySelector('.seat-tooltip');
  if (gId) {
    const g = guests.find(x => x.id === gId);
    seatEl.classList.add('occupied');
    seatEl.classList.remove('female', 'male');
    seatEl.classList.add(g.gender === 'f' ? 'female' : 'male');
    // Show full name inside circle (wraps if needed)
    const nameParts = g.name.split(' ');
    initialsEl.textContent = nameParts.length >= 2
      ? nameParts[0] + '\n' + nameParts.slice(1).join(' ')
      : g.name;
    initialsEl.style.whiteSpace = 'pre';
    tooltip.textContent = g.name + (g.diet ? ` · ${g.diet}` : '');
  } else {
    seatEl.classList.remove('occupied', 'female', 'male');
    initialsEl.textContent = '';
    tooltip.textContent = 'Empty';
  }
}

// ============================================================
// TABLE DETAIL PANEL
// ============================================================
function showTableDetail(tableId) {
  activeTableId = tableId;
  const tbl = TABLES.find(t => t.id === tableId);
  const content = document.getElementById('detailContent');
  const total = tbl.topSeats + tbl.botSeats + (tbl.leftSeats||0) + (tbl.rightSeats||0);
  const occupied = Object.entries(seatingState)
    .filter(([k, v]) => k.startsWith(tableId + '-') && v)
    .length;

  let html = `<div class="table-detail-header">
    <h3>${tbl.label}</h3>
    <p>${occupied} / ${total} seats filled</p>
  </div><div class="seated-list">`;

  const keys = Object.keys(seatingState).filter(k => k.startsWith(tableId + '-'));
  keys.forEach(k => {
    const gId = seatingState[k];
    if (!gId) return;
    const g = guests.find(x => x.id === gId);
    const seatNum = parseInt(k.split('-')[1]) + 1;
    html += `<div class="seated-person">
      <span>${g.name}</span>
      <span class="seat-num">#${seatNum}</span>
      <button class="remove-btn" data-key="${k}" title="Remove">×</button>
    </div>`;
  });

  if (occupied === 0) html += '<div style="padding:12px 16px;font-size:0.75rem;color:var(--mid);font-style:italic;">No guests seated yet</div>';
  html += '</div>';
  content.innerHTML = html;

  content.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => removeGuestFromSeat(btn.dataset.key));
  });
}

// ============================================================
// CONTEXT MENU
// ============================================================
let contextSeatKey = null;
function showContextMenu(e, seatKey, gId) {
  contextSeatKey = seatKey;
  const menu = document.getElementById('contextMenu');
  const title = document.getElementById('contextMenuTitle');
  const guest = guests.find(g => g.id === gId);
  title.textContent = guest ? guest.name : 'Seat';
  menu.style.left = e.clientX + 'px';
  menu.style.top  = e.clientY + 'px';
  menu.classList.add('visible');
}
document.getElementById('contextRemove').addEventListener('click', () => {
  if (contextSeatKey) removeGuestFromSeat(contextSeatKey);
  document.getElementById('contextMenu').classList.remove('visible');
  contextSeatKey = null;
});
document.addEventListener('click', e => {
  if (!e.target.closest('#contextMenu')) {
    document.getElementById('contextMenu').classList.remove('visible');
  }
});

// ============================================================
// DRAG GHOST FOLLOW MOUSE
// ============================================================
document.addEventListener('dragover', e => {
  const ghost = document.getElementById('dragGhost');
  if (ghost.style.display === 'block') {
    ghost.style.left = (e.clientX + 14) + 'px';
    ghost.style.top  = (e.clientY + 8)  + 'px';
  }
});

// ============================================================
// SEARCH + FILTER
// ============================================================
// Guest list panel as drop zone — drag a seated guest here to unseat them
const guestPanel = document.querySelector('.guest-panel');
guestPanel.addEventListener('dragover', e => { e.preventDefault(); guestPanel.style.outline = '2px dashed var(--gold)'; });
guestPanel.addEventListener('dragleave', () => { guestPanel.style.outline = ''; });
guestPanel.addEventListener('drop', e => {
  e.preventDefault();
  guestPanel.style.outline = '';
  if (dragSourceSeatKey) {
    dropHandled = true;
    removeGuestFromSeat(dragSourceSeatKey);
    dragGuestId = null;
    dragSourceSeatKey = null;
  }
});

document.getElementById('guestSearch').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderGuestList();
});
document.querySelectorAll('.filter-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGuestList();
  });
});

// ============================================================
// AUTO-SEAT: pre-populate guests into their suggested tables
// ============================================================
function autoSeatGuests() {
  // ── Table 3: French Warriors — precise arrangement ──────────
  // Seat index order: top 0-11, left-end=12, right-end=13, bottom 14-25
  const t3Order = [
    // top row positions 0-11
    "Caroline Ferber", "Ben Marshall", "Jocelyne Simonet", "Gérard Gay",
    "Laurence Bernard", "Gabriel Soudry", "Nathalie Kerfridin", "David Nes",
    "Frédérica Roquebert", "Xavier Rollin", "Valerie Coriatt", "William Assouline",
    // left end (index 12)
    "Luc Teboul",
    // right end (index 13)
    "Caroline Prati",
    // bottom row positions 14-25
    "Bob Ferber", "Magali Cayol", "Jean-Yves Simonet", "Ailsa Marshall",
    "Laurent Bernard", "Christine Soudry", "Laurent Kerfridin", "Eugenie Nes",
    "Pierre-Olivier Roquebert", "Ariane Regnier", "Andreas Stein", "Réjane Rollin",
  ];

  t3Order.forEach((name, idx) => {
    const guest = guests.find(g => g.name === name);
    if (!guest) return;
    const seatKey = `t3-${idx}`;
    if (seatingState[seatKey] === null) {
      seatingState[seatKey] = guest.id;
      guest.seated = true;
      guest.seatKey = seatKey;
    }
  });

  // ── All other tables: auto-fill in guest list order ─────────
  const tableMap = {
    "Table 1 - Head Table":                      "t1",
    "Table 2 - La Moutonne City":                "t2",
    "Table 4 - Young Frenchies / Internationals":"t4",
    "Table 5 - Long Lost Cousins":               "t5",
    "Table 6 - Kids Corner":                     "t6",
    "Table 7 - Germans":                         "t7",
    "Table 8 - Americans":                       "t8",
  };
  guests.forEach(g => {
    if (g.seated) return; // already placed (Table 3)
    const tId = tableMap[g.suggestedTable];
    if (!tId) return;
    const emptyKey = Object.keys(seatingState).find(k => k.startsWith(tId + '-') && seatingState[k] === null);
    if (emptyKey) {
      seatingState[emptyKey] = g.id;
      g.seated = true;
      g.seatKey = emptyKey;
    }
  });
}

// ============================================================
(function() {
  const area    = document.getElementById('floorPlanArea');
  const container = document.getElementById('floorContainer');
  const levelEl  = document.getElementById('zoomLevel');

  const MIN_SCALE = 0.3;
  const MAX_SCALE = 2.0;
  const STEP = 0.15;

  let scale = 1;
  let panX = 20;
  let panY = 20;
  let isPanning = false;
  let panStartX = 0;
  let panStartY = 0;
  let panStartPanX = 0;
  let panStartPanY = 0;

  function applyTransform() {
    container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    levelEl.textContent = Math.round(scale * 100) + '%';
  }

  function clampPan() {
    // Loose clamp — let user pan freely but not lose the map entirely
    const areaW = area.clientWidth;
    const areaH = area.clientHeight;
    const mapW  = 1660 * scale;
    const mapH  = 840  * scale;
    const margin = 100;
    panX = Math.min(panX, areaW - margin);
    panX = Math.max(panX, margin - mapW);
    panY = Math.min(panY, areaH - margin);
    panY = Math.max(panY, margin - mapH);
  }

  function zoomTo(newScale, originX, originY) {
    // originX/Y are in area coords — keep the point under cursor fixed
    const clampedScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const factor = clampedScale / scale;
    panX = originX - factor * (originX - panX);
    panY = originY - factor * (originY - panY);
    scale = clampedScale;
    clampPan();
    applyTransform();
  }

  function resetView() {
    scale = 1;
    panX = 20;
    panY = 20;
    applyTransform();
  }

  // Initial position
  applyTransform();

  // Zoom buttons
  document.getElementById('zoomIn').addEventListener('click', e => {
    e.stopPropagation();
    const cx = area.clientWidth / 2;
    const cy = area.clientHeight / 2;
    zoomTo(scale + STEP, cx, cy);
  });
  document.getElementById('zoomOut').addEventListener('click', e => {
    e.stopPropagation();
    const cx = area.clientWidth / 2;
    const cy = area.clientHeight / 2;
    zoomTo(scale - STEP, cx, cy);
  });
  document.getElementById('zoomReset').addEventListener('click', e => {
    e.stopPropagation();
    resetView();
  });

  // Buttons only — no mouse wheel zoom (wheel is reserved for normal page scroll)

  // Pan — middle mouse or left mouse on background
  area.addEventListener('mousedown', e => {
    if (e.button === 1 || (e.button === 0 && (e.target === area || e.target === container || e.target.classList.contains('floor-viewport')))) {
      isPanning = true;
      panStartX = e.clientX;
      panStartY = e.clientY;
      panStartPanX = panX;
      panStartPanY = panY;
      area.classList.add('panning');
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = panStartPanX + (e.clientX - panStartX);
    panY = panStartPanY + (e.clientY - panStartY);
    clampPan();
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    if (isPanning) {
      isPanning = false;
      area.classList.remove('panning');
    }
  });

  // Touch — pinch to zoom + drag to pan
  // Listen at document capture phase so we catch touches on any child element
  let lastTouchDist = null;
  let pinchActive = false;

  function getTouchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  function getTouchMid(e) {
    return {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
    };
  }
  function isInArea(e) {
    const rect = area.getBoundingClientRect();
    const t = e.touches[0];
    return t.clientX >= rect.left && t.clientX <= rect.right &&
           t.clientY >= rect.top  && t.clientY <= rect.bottom;
  }

  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2 && isInArea(e)) {
      pinchActive = true;
      isPanning = false;
      lastTouchDist = getTouchDist(e);
    } else if (e.touches.length === 1 && isInArea(e)) {
      isPanning = true;
      panStartX = e.touches[0].clientX;
      panStartY = e.touches[0].clientY;
      panStartPanX = panX;
      panStartPanY = panY;
    }
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (pinchActive && e.touches.length === 2) {
      e.preventDefault();
      const dist = getTouchDist(e);
      const mid  = getTouchMid(e);
      const rect = area.getBoundingClientRect();

      if (lastTouchDist && lastTouchDist > 0) {
        const rawFactor = dist / lastTouchDist;
        // 50% of raw — responsive but not hair-trigger
        const factor = 1 + (rawFactor - 1) * 0.5;
        zoomTo(scale * factor, mid.x - rect.left, mid.y - rect.top);
      }
      lastTouchDist = dist;
    } else if (isPanning && e.touches.length === 1) {
      panX = panStartPanX + (e.touches[0].clientX - panStartX);
      panY = panStartPanY + (e.touches[0].clientY - panStartY);
      clampPan();
      applyTransform();
    }
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      pinchActive = false;
      lastTouchDist = null;
    }
    if (e.touches.length === 0) isPanning = false;
  }, { passive: true });
})();
