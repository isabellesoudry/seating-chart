<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Seating Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf7f2;
  --warm-white: #fff9f0;
  --sage: #7a9e7e;
  --dusty-rose: #c4837a;
  --gold: #c9a84c;
  --deep: #2c2416;
  --mid: #6b5c3e;
  --light: #e8dcc8;
  --table-bg: #2c6e8a;
  --table-hover: #1e5470;
  --chair-color: #a8d4e8;
  --chair-seated: #7a9e7e;
  --chair-female: #e8889a;
  --chair-female-seated: #d4607a;
  --chair-male: #6aaac8;
  --chair-male-seated: #3d85ab;
  --shadow: 0 4px 24px rgba(44,36,22,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--deep);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: var(--warm-white);
  border-bottom: 1px solid var(--light);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 100;
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  color: var(--deep);
  font-style: italic;
}
.stats {
  display: flex;
  gap: 20px;
  font-size: 0.78rem;
  color: var(--mid);
}
.stat span { font-weight: 600; color: var(--deep); }
.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* LEFT PANEL */
.guest-panel {
  width: 190px;
  background: var(--warm-white);
  border-right: 1px solid var(--light);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width 0.22s ease;
}
.guest-panel.collapsed { width: 28px; }
.guest-panel.collapsed .search-box,
.guest-panel.collapsed .filter-tabs,
.guest-panel.collapsed .guest-list { display: none; }
.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--light);
  background: var(--cream);
  position: relative;
}
.panel-toggle-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  background: none;
  border: 1px solid var(--light);
  border-radius: 4px;
  cursor: pointer;
  color: var(--mid);
  font-size: 0.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, color 0.12s;
  flex-shrink: 0;
  line-height: 1;
  padding: 0;
}
.panel-toggle-btn:hover { background: var(--light); color: var(--deep); }
.guest-panel .panel-toggle-btn { right: 8px; }
.detail-panel .panel-toggle-btn { left: 8px; }
/* Collapsed state — show only a thin strip with toggle button */
.guest-panel.collapsed .panel-header,
.detail-panel.collapsed .panel-header {
  padding: 8px 4px;
  border-bottom: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  height: 100%;
  overflow: hidden;
}
.guest-panel.collapsed .panel-header h2,
.detail-panel.collapsed .panel-header h2 {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 0.62rem;
  margin: 0;
  white-space: nowrap;
  color: var(--mid);
  letter-spacing: 0.1em;
}
.guest-panel.collapsed .panel-toggle-btn,
.detail-panel.collapsed .panel-toggle-btn {
  position: static;
  transform: none;
}
.panel-header h2 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--mid);
  margin-bottom: 8px;
  font-weight: 500;
}
.search-box {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--light);
  border-radius: 6px;
  background: var(--warm-white);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--deep);
  outline: none;
}
.search-box:focus { border-color: var(--sage); }
.filter-tabs {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}
.filter-tab {
  flex: 1;
  padding: 4px 0;
  font-size: 0.7rem;
  border: 1px solid var(--light);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  color: var(--mid);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.filter-tab.active { background: var(--deep); color: white; border-color: var(--deep); }
.guest-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.guest-item {
  padding: 7px 16px;
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-left: 3px solid transparent;
  transition: all 0.12s;
  user-select: none;
}
.guest-item:hover { background: var(--light); border-left-color: var(--gold); }
.guest-item.seated { opacity: 0.45; }
.guest-item.dragging { opacity: 0.3; }
.guest-name { font-size: 0.82rem; font-weight: 500; color: var(--deep); }
.guest-meta { font-size: 0.68rem; color: var(--mid); }
.diet-badge {
  display: inline-block;
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--light);
  color: var(--mid);
  margin-top: 2px;
}
.diet-badge.veg { background: #d4edda; color: #2d6a4f; }
.diet-badge.allergy { background: #fff3cd; color: #856404; }

/* FLOOR PLAN */
.floor-plan-area {
  flex: 1;
  overflow: hidden;
  background: var(--cream);
  position: relative;
  cursor: grab;
  user-select: none;
}
.floor-plan-area.panning { cursor: grabbing; }
.floor-viewport {
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: relative;
}
.floor-container {
  position: absolute;
  width: 1660px;
  height: 840px;
  background: var(--warm-white);
  border: 1px solid var(--light);
  border-radius: 12px;
  box-shadow: var(--shadow);
  transform-origin: 0 0;
}
/* Zoom controls */
.zoom-controls {
  position: absolute;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 50;
}
.zoom-btn {
  width: 32px;
  height: 32px;
  background: var(--warm-white);
  border: 1px solid var(--light);
  border-radius: 6px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--deep);
  font-weight: 500;
  transition: background 0.12s;
  line-height: 1;
}
.zoom-btn:hover { background: var(--light); }
.zoom-level {
  width: 32px;
  height: 24px;
  background: var(--warm-white);
  border: 1px solid var(--light);
  border-radius: 6px;
  font-size: 0.6rem;
  color: var(--mid);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Sans', sans-serif;
}

/* Seat count labels */
.seat-count-label {
  position: absolute;
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--mid);
  font-family: 'DM Sans', sans-serif;
}

/* Dancefloor */
.dancefloor {
  position: absolute;
  background: linear-gradient(160deg, #d4a574 0%, #c49060 40%, #b8844e 100%);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
}
.dj-booth {
  position: absolute;
  background: var(--table-bg);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.05em;
}
.entrance-marker {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.entrance-arrow {
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 14px solid var(--deep);
}
.entrance-label {
  font-size: 0.65rem;
  color: var(--mid);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* TABLE GROUP — absolutely positioned wrapper */
.table-group {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  cursor: move;
  user-select: none;
}
.table-group:hover .table-drag-handle { opacity: 1; }
.table-drag-handle {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.55rem;
  color: var(--mid);
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}
.table-group.dragging-table { opacity: 0.7; z-index: 500; }
.table-group.block-drop-target-possible { outline: 2px dashed var(--gold); outline-offset: 4px; border-radius: 6px; }
.table-group.block-drop-hover { outline: 2px solid var(--sage); outline-offset: 4px; border-radius: 6px; background: rgba(122,158,126,0.06); }

/* Table name label above the content */
.table-name-label {
  font-size: 0.62rem;
  font-weight: 600;
  color: var(--mid);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 2px;
  white-space: nowrap;
  pointer-events: all;
  cursor: text;
  border-bottom: 1px dashed transparent;
  transition: border-color 0.15s, color 0.15s;
}
.table-name-label:hover {
  color: var(--deep);
  border-bottom-color: var(--gold);
}

/* Table content wrapper */
.table-content {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* The table rectangle — now a flex row of block segments */
.table-rect {
  background: var(--table-bg);
  border-radius: 4px;
  display: flex;
  align-items: stretch;
  color: white;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
  overflow: hidden;
}
.table-rect:hover { background: var(--table-hover); }

/* Individual block segment inside the table rect */
.table-block {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  flex-grow: 0;
  cursor: grab;
  position: relative;
  box-sizing: border-box;
}
.table-block:active { cursor: grabbing; }
.table-block + .table-block {
  border-left: 1px solid rgba(255,255,255,0.22);
}
.table-block:hover {
  background: rgba(255,255,255,0.08);
}

/* Middle row: optional side seats + table */
.table-mid-row {
  display: flex;
  align-items: center;
  width: 100%;
}

/* Seat rows */
.seats-row {
  display: flex;
  gap: 3px;
  justify-content: flex-start;
  box-sizing: border-box;
}

/* SEAT */
.seat {
  width: 34px;
  height: 34px;
  background: var(--chair-color);
  opacity: 0.85;
  cursor: grab;
  transition: all 0.15s;
  position: relative;
  flex-shrink: 0;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}
/* Chair shape — clean circle with subtle flat on table side */
.seat[data-side="top"]    { border-radius: 50% 50% 45% 45%; }
.seat[data-side="bottom"] { border-radius: 45% 45% 50% 50%; }
.seat[data-side="left"]   { border-radius: 50%; }
.seat[data-side="right"]  { border-radius: 50%; }

.seat.occupied { background: var(--chair-seated); opacity: 1; cursor: grab; }
.seat.female { background: var(--chair-female); opacity: 0.85; }
.seat.male   { background: var(--chair-male);   opacity: 0.85; }
.seat.female.occupied { background: var(--chair-female-seated); opacity: 1; }
.seat.male.occupied   { background: var(--chair-male-seated);   opacity: 1; }
.seat.highlight { border-color: var(--gold); transform: scale(1.15); opacity: 1; }
.seat:hover { opacity: 1; transform: scale(1.1); border-color: var(--gold); }
.seat.drop-target { border-color: var(--sage); transform: scale(1.2); opacity: 1; background: var(--sage); }
.seat.dragging-out { opacity: 0.35; }

.seat-initials {
  font-size: 7px;
  font-weight: 700;
  color: white;
  letter-spacing: -0.3px;
  line-height: 1.1;
  pointer-events: none;
  user-select: none;
  text-align: center;
  position: absolute;
  padding: 1px 2px;
  max-width: 32px;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: normal;
}
.seat-tooltip {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--deep);
  color: white;
  font-size: 0.68rem;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 200;
  pointer-events: none;
}
.seat-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-top-color: var(--deep);
}
.seat:hover .seat-tooltip { display: block; }

/* CONTEXT MENU */
.context-menu {
  position: fixed;
  background: white;
  border: 1px solid var(--light);
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  padding: 4px 0;
  z-index: 1000;
  min-width: 160px;
  display: none;
}
.context-menu.visible { display: block; }
.context-menu-title {
  padding: 6px 14px;
  font-size: 0.7rem;
  color: var(--mid);
  border-bottom: 1px solid var(--light);
  font-style: italic;
}
.context-item {
  padding: 7px 14px;
  font-size: 0.78rem;
  cursor: pointer;
  color: var(--deep);
  transition: background 0.1s;
}
.context-item:hover { background: var(--light); }
.context-item.danger { color: var(--dusty-rose); }

/* DRAG GHOST */
.drag-ghost {
  position: fixed;
  background: var(--deep);
  color: white;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.72rem;
  pointer-events: none;
  z-index: 9999;
  display: none;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

/* RIGHT PANEL */
.detail-panel {
  width: 170px;
  background: var(--warm-white);
  border-left: 1px solid var(--light);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width 0.22s ease;
}
.detail-panel.collapsed { width: 28px; }
.detail-panel.collapsed .detail-content { display: none; }
.detail-content { flex: 1; overflow-y: auto; }
.detail-placeholder {
  padding: 20px 16px;
  text-align: center;
  color: var(--mid);
  font-size: 0.78rem;
  font-style: italic;
}
.table-detail-header {
  padding: 10px 16px;
  background: var(--table-bg);
  color: white;
}
.table-detail-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 0.9rem;
}
.table-detail-header p { font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }
.seated-list { padding: 8px 0; }
.seated-person {
  padding: 5px 16px;
  font-size: 0.75rem;
  color: var(--deep);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.seated-person .remove-btn {
  background: none; border: none;
  cursor: pointer;
  color: var(--dusty-rose);
  font-size: 0.85rem;
  line-height: 1; opacity: 0.6;
  transition: opacity 0.1s;
}
.seated-person .remove-btn:hover { opacity: 1; }
.seat-num {
  font-size: 0.65rem; color: var(--mid);
  background: var(--light);
  border-radius: 3px; padding: 1px 4px;
  flex-shrink: 0;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--light); border-radius: 2px; }
.guest-section-header {
  padding: 4px 16px 2px;
  font-size: 0.63rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gold);
  background: var(--cream);
  border-top: 1px solid var(--light);
  font-weight: 600;
}
</style>
</head>
<body>

<header>
  <h1>✦ Wedding Seating Chart</h1>
  <div class="stats">
    <div>Guests: <span id="total-guests">0</span></div>
    <div>Seated: <span id="seated-count">0</span></div>
    <div>Unseated: <span id="unseated-count">0</span></div>
  </div>
  <div style="font-size:0.72rem;color:var(--mid);">Drag guests → seats &nbsp;•&nbsp; Right-click seat to remove</div>
</header>

<div class="app-body">
  <!-- LEFT: Guest List -->
  <div class="guest-panel">
    <div class="panel-header">
      <h2>Guest List</h2>
      <button class="panel-toggle-btn" id="toggleGuestPanel" title="Collapse panel">&#8249;</button>
      <input class="search-box" type="text" placeholder="Search guests…" id="guestSearch">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="unseated">Unseated</button>
        <button class="filter-tab" data-filter="seated">Seated</button>
      </div>
    </div>
    <div class="guest-list" id="guestList"></div>
  </div>

  <!-- CENTER: Floor Plan -->
  <div class="floor-plan-area" id="floorPlanArea">
    <div class="floor-viewport" id="floorViewport">
      <div class="floor-container" id="floorContainer">
        <!-- Static room elements -->
        <div class="dancefloor" style="left:620px;top:230px;width:380px;height:260px;">Dancefloor</div>
        <div class="dj-booth" style="left:620px;top:594px;width:190px;height:40px;">DJ</div>
        <div class="entrance-marker" style="left:860px;top:588px;">
          <div class="entrance-arrow"></div>
          <div class="entrance-label">Entrance</div>
        </div>
        <div class="dj-booth" style="left:60px;top:672px;width:220px;height:40px;font-size:0.65rem;">Buffet pour fromage / dessert</div>
        <!-- Tables injected by JS -->
      </div>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
      <div class="zoom-level" id="zoomLevel">100%</div>
      <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
      <button class="zoom-btn" id="zoomReset" title="Reset zoom" style="font-size:0.7rem;">⌂</button>
    </div>
  </div>

  <!-- RIGHT: Table Detail -->
  <div class="detail-panel">
    <div class="panel-header">
      <button class="panel-toggle-btn" id="toggleDetailPanel" title="Collapse panel">&#8250;</button>
      <h2>Table Detail</h2>
    </div>
    <div class="detail-content" id="detailContent">
      <div class="detail-placeholder">Click a table to see seated guests</div>
    </div>
  </div>
</div>

<div class="drag-ghost" id="dragGhost"></div>
<div class="context-menu" id="contextMenu">
  <div class="context-menu-title" id="contextMenuTitle">Seat</div>
  <div class="context-item danger" id="contextRemove">Remove guest</div>
</div>

<script>

// ============================================================
// TABLE LAYOUT — matched precisely to the image
//
// Each table definition:
//   id, label, pos {left, top} = top-left of the entire group
//   tableW: width of the actual table rectangle
//   tableH: height of the table rectangle
//   topSeats: number of seats above the table
//   botSeats: number of seats below the table
//   leftSeats: number of seats on the left end (Table 3 only)
//   rightSeats: number of seats on the right end (Table 3 only)
//
// Seat indexing order: top row L→R, then left side T→B, then right side T→B, then bottom row L→R
// ============================================================

// SEAT_SIZE and GAP affect spacing
const SEAT_SIZE = 34;
const SEAT_GAP  = 3;

// T1: 17 * 34 + 16 * 3 = 578 + 48 = 626px wide

// T5: 8  * 34 + 7  * 3 = 272 + 21 = 293px wide
// T6: 8  * 34 + 7  * 3 = 272 + 21 = 293px wide (12 named guests)
// T7: 12 * 34 + 11 * 3 = 408 + 33 = 441px wide
// T8: 12 * 34 + 11 * 3 = 408 + 33 = 441px wide
//
// Layout (matching image):
// Left column:  T2 top-left, T3 mid-left, T4 lower-left, T5 bottom-left
// Center-top:   T1 head table spanning center
// Right column: T6 top-right, T7 mid-right, T8 lower-right
// Center:       Dancefloor, DJ, Entrance
//

// ============================================================
// BLOCK SYSTEM
// Each table is made of N blocks. Each block owns its seats.
// Seat keys: "{blockId}-top-{n}", "{blockId}-bot-{n}", "{blockId}-left", "{blockId}-right"
// This makes seat keys stable when blocks move between tables.
// ============================================================

// Derive BLOCKS from TABLES
// Block layout within a table:
//   - Inner blocks: 3 top + 3 bottom seats
//   - Left-end block (if table has leftSeats): adds left-end seat
//   - Right-end block (if table has rightSeats): adds right-end seat
const BLOCKS = [];
TABLES.forEach(t => {
  const n = t.blocks || 1;
  for (let b = 0; b < n; b++) {
    BLOCKS.push({
      id:      `${t.id}_b${b}`,
      tableId: t.id,
      order:   b,
      topSeats: 3,
      botSeats: 3,
      leftSeat:  (b === 0     && (t.leftSeats  || 0) > 0),
      rightSeat: (b === n - 1 && (t.rightSeats || 0) > 0),
    });
  }
  // Handle tables where seat counts don't divide evenly into 3-per-block
  // The last block may have fewer seats — we'll compute per-block seats dynamically
  // Top: spread seats across blocks; first blocks get 3, last may get remainder
  const topSeats = t.topSeats;
  const botSeats = t.botSeats;
  BLOCKS.filter(b => b.tableId === t.id).forEach((b, i) => {
    const remaining_top = topSeats - i * 3;
    const remaining_bot = botSeats - i * 3;
    b.topSeats = Math.min(3, Math.max(0, remaining_top));
    b.botSeats = Math.min(3, Math.max(0, remaining_bot));
  });
});

// ============================================================
// STATE
// ============================================================
const seatingState = {}; // seatKey → guestId | null

// Init all seat keys for all blocks
function initSeatingState() {
  BLOCKS.forEach(b => {
    for (let i = 0; i < b.topSeats; i++) seatingState[`${b.id}-top-${i}`] = null;
    for (let i = 0; i < b.botSeats; i++) seatingState[`${b.id}-bot-${i}`] = null;
    if (b.leftSeat)  seatingState[`${b.id}-left`]  = null;
    if (b.rightSeat) seatingState[`${b.id}-right`] = null;
  });
}
initSeatingState();

// Runtime block table membership (blocks can move tables)
// blockTableMap: blockId → tableId (or null if free-floating)
const blockTableMap = {};
BLOCKS.forEach(b => { blockTableMap[b.id] = b.tableId; });

// Free block positions (for blocks dragged off their table)
const freeBlockPos = {}; // blockId → {left, top}

let guests = GUESTS_RAW.map((g, i) => ({
  id: `g${i}`,
  name: `${g.first} ${g.last}`,
  first: g.first, last: g.last,
  meal: g.meal, diet: g.diet,
  gender: g.gender || 'm',
  suggestedTable: g.table,
  seated: false, seatKey: null,
}));

let dragGuestId = null;
let dragSourceSeatKey = null;
let dropHandled = false;
let activeFilter = 'all';
let searchTerm = '';
let activeTableId = null;

// The block currently being dragged between tables
let draggingBlockId = null;

// ============================================================
// BUILD FLOOR
// ============================================================
function getScale() {
  const transform = document.getElementById('floorContainer').style.transform || '';
  const m = transform.match(/scale\(([^)]+)\)/);
  return m ? parseFloat(m[1]) : 1;
}

function buildFloor() {
  const container = document.getElementById('floorContainer');

  // Build table group wrappers
  TABLES.forEach(t => {
    const wrapper = document.createElement('div');
    wrapper.className = 'table-group';
    wrapper.style.left = t.pos.left + 'px';
    wrapper.style.top  = t.pos.top  + 'px';
    wrapper.dataset.tableId = t.id;
    wrapper.id = `table-group-${t.id}`;

    // Drag handle hint
    const handle = document.createElement('div');
    handle.className = 'table-drag-handle';
    handle.textContent = '⠿ drag table';
    wrapper.appendChild(handle);

    // Table label — double-click to rename
    const labelEl = document.createElement('div');
    labelEl.className = 'table-name-label';
    labelEl.textContent = t.label;
    labelEl.title = 'Double-click to rename';
    labelEl.addEventListener('dblclick', e => {
      e.stopPropagation();
      const current = t.label;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = current;
      input.style.cssText = `
        font-size:0.62rem; font-weight:600; font-family:'DM Sans',sans-serif;
        color:var(--deep); background:var(--warm-white);
        border:1px solid var(--gold); border-radius:3px;
        padding:1px 4px; outline:none; width:180px;
        text-transform:uppercase; letter-spacing:0.08em;
      `;
      labelEl.replaceWith(input);
      input.focus();
      input.select();

      const commit = () => {
        const newName = input.value.trim() || current;
        t.label = newName;
        // Update block rect label inside the table too
        const rectsRow = document.querySelector(`#table-group-${t.id} .table-rect`);
        if (rectsRow) {
          const firstBlock = rectsRow.querySelector('.table-block');
          if (firstBlock) {
            let lbl = firstBlock.querySelector('.table-block-label');
            if (lbl) lbl.textContent = newName;
          }
        }
        labelEl.textContent = newName;
        input.replaceWith(labelEl);
        saveState();
      };

      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { input.value = current; commit(); }
      });
    });
    wrapper.appendChild(labelEl);

    // Content: rows of seats + block rects
    const content = buildTableContent(t.id);
    wrapper.appendChild(content);

    container.appendChild(wrapper);
    makeDraggableTable(wrapper, t);
  });
}

function buildTableContent(tableId) {
  const t = TABLES.find(x => x.id === tableId);
  const blocks = BLOCKS.filter(b => blockTableMap[b.id] === tableId)
                       .sort((a, b) => a.order - b.order);

  const content = document.createElement('div');
  content.className = 'table-content';
  content.dataset.tableId = tableId;

  if (blocks.length === 0) {
    content.style.minWidth = '80px';
    content.style.minHeight = '30px';
    return content;
  }

  // Precise block width: 3 seats + 2 gaps between them
  const BLOCK_W = 3 * SEAT_SIZE + 2 * SEAT_GAP; // = 108px
  const BLOCK_BORDER = 1; // 1px divider between blocks
  const END_SEAT_GAP = 4; // gap between end seat and table rect

  const hasLeft  = blocks[0].leftSeat;
  const hasRight = blocks[blocks.length - 1].rightSeat;

  // Total table rect width: sum of block widths + dividers between them
  const tableRectW = blocks.length * BLOCK_W + (blocks.length - 1) * BLOCK_BORDER;
  // Total content width including end seats
  const endW = (hasLeft ? SEAT_SIZE + END_SEAT_GAP : 0) + (hasRight ? SEAT_SIZE + END_SEAT_GAP : 0);
  const totalW = tableRectW + endW;

  content.style.width = totalW + 'px';

  // ── TOP ROW ──
  const topRow = document.createElement('div');
  topRow.className = 'seats-row';
  topRow.style.cssText = `
    display:flex; gap:${SEAT_GAP}px; margin-bottom:3px;
    padding-left:${hasLeft ? SEAT_SIZE + END_SEAT_GAP : 0}px;
    padding-right:${hasRight ? SEAT_SIZE + END_SEAT_GAP : 0}px;
    width:${totalW}px; box-sizing:border-box;
  `;

  blocks.forEach((b, bi) => {
    for (let i = 0; i < b.topSeats; i++) {
      const seat = makeSeat(`${b.id}-top-${i}`, 'top', b.id);
      // Block gap: add right margin after last seat of each block (except final block)
      if (i === b.topSeats - 1 && bi < blocks.length - 1) {
        seat.style.marginRight = (BLOCK_BORDER + SEAT_GAP) + 'px';
      }
      topRow.appendChild(seat);
    }
  });
  content.appendChild(topRow);

  // ── MID ROW ──
  const midRow = document.createElement('div');
  midRow.className = 'table-mid-row';
  midRow.style.cssText = `display:flex; align-items:center; gap:0; width:${totalW}px;`;

  if (hasLeft) {
    const ls = makeSeat(`${blocks[0].id}-left`, 'left', blocks[0].id);
    ls.style.cssText += `flex-shrink:0; margin-right:${END_SEAT_GAP}px;`;
    midRow.appendChild(ls);
  }

  // Table rect: exactly tableRectW wide, divided into equal block segments
  const rectsRow = document.createElement('div');
  rectsRow.className = 'table-rect';
  rectsRow.style.cssText = `width:${tableRectW}px; height:${t.tableH || 38}px; flex-shrink:0;`;
  rectsRow.addEventListener('click', () => showTableDetail(tableId));

  blocks.forEach((b, bi) => {
    const seg = document.createElement('div');
    seg.className = 'table-block';
    seg.dataset.blockId = b.id;
    seg.title = 'Drag to move this block';
    // Each block segment is exactly BLOCK_W wide
    seg.style.cssText = `width:${BLOCK_W}px; flex-shrink:0; flex-grow:0;`;
    const dragIcon = document.createElement('span');
    dragIcon.style.cssText = 'font-size:10px;opacity:0.4;cursor:grab;user-select:none;';
    dragIcon.textContent = '⠿';
    seg.appendChild(dragIcon);
    rectsRow.appendChild(seg);
    makeBlockDraggable(seg, b);
  });

  midRow.appendChild(rectsRow);

  if (hasRight) {
    const rs = makeSeat(`${blocks[blocks.length-1].id}-right`, 'right', blocks[blocks.length-1].id);
    rs.style.cssText += `flex-shrink:0; margin-left:${END_SEAT_GAP}px;`;
    midRow.appendChild(rs);
  }
  content.appendChild(midRow);

  // ── BOTTOM ROW ──
  const botRow = document.createElement('div');
  botRow.className = 'seats-row';
  botRow.style.cssText = `
    display:flex; gap:${SEAT_GAP}px; margin-top:3px;
    padding-left:${hasLeft ? SEAT_SIZE + END_SEAT_GAP : 0}px;
    padding-right:${hasRight ? SEAT_SIZE + END_SEAT_GAP : 0}px;
    width:${totalW}px; box-sizing:border-box;
  `;

  blocks.forEach((b, bi) => {
    for (let i = 0; i < b.botSeats; i++) {
      const seat = makeSeat(`${b.id}-bot-${i}`, 'bottom', b.id);
      if (i === b.botSeats - 1 && bi < blocks.length - 1) {
        seat.style.marginRight = (BLOCK_BORDER + SEAT_GAP) + 'px';
      }
      botRow.appendChild(seat);
    }
  });
  content.appendChild(botRow);

  return content;
}

function rebuildTableContent(tableId) {
  const wrapper = document.getElementById(`table-group-${tableId}`);
  if (!wrapper) return;
  const old = wrapper.querySelector('.table-content');
  if (old) old.remove();
  const content = buildTableContent(tableId);
  wrapper.appendChild(content);
  // Re-refresh all seats for this table
  BLOCKS.filter(b => blockTableMap[b.id] === tableId).forEach(b => {
    Object.keys(seatingState)
      .filter(k => k.startsWith(b.id))
      .forEach(k => refreshSeatUI(k));
  });
}

// ============================================================
// BLOCK DRAGGING (between tables)
// ============================================================
function makeBlockDraggable(segEl, block) {
  let isDragging = false;
  let ghost = null;

  segEl.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isDragging = true;
    draggingBlockId = block.id;
    e.stopPropagation(); // don't trigger table drag

    // Create a visual ghost
    ghost = document.createElement('div');
    ghost.style.cssText = `
      position:fixed; pointer-events:none; z-index:9999;
      background:var(--table-bg); color:white; border-radius:4px;
      padding:4px 10px; font-size:0.7rem; font-family:'DM Sans',sans-serif;
      opacity:0.85; box-shadow:0 4px 16px rgba(0,0,0,0.25);
    `;
    ghost.textContent = `Block from ${TABLES.find(t=>t.id===blockTableMap[block.id])?.label || ''}`;
    document.body.appendChild(ghost);
    ghost.style.left = e.clientX + 10 + 'px';
    ghost.style.top  = e.clientY + 10 + 'px';

    // Highlight valid drop targets
    document.querySelectorAll('.table-group').forEach(tg => {
      if (tg.dataset.tableId !== blockTableMap[block.id]) {
        tg.classList.add('block-drop-target-possible');
      }
    });

    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging || !ghost) return;
    ghost.style.left = e.clientX + 10 + 'px';
    ghost.style.top  = e.clientY + 10 + 'px';
  });

  window.addEventListener('mouseup', e => {
    if (!isDragging) return;
    isDragging = false;
    if (ghost) { ghost.remove(); ghost = null; }
    document.querySelectorAll('.block-drop-target-possible, .block-drop-hover')
      .forEach(el => el.classList.remove('block-drop-target-possible', 'block-drop-hover'));

    // Find which table group we dropped onto
    const els = document.elementsFromPoint(e.clientX, e.clientY);
    let targetTableId = null;
    for (const el of els) {
      const tg = el.closest('.table-group');
      if (tg && tg.dataset.tableId !== blockTableMap[block.id]) {
        targetTableId = tg.dataset.tableId;
        break;
      }
    }

    if (targetTableId) {
      moveBlockToTable(block.id, targetTableId);
    }
    draggingBlockId = null;
  });

  // Hover highlight
  document.querySelectorAll('.table-group').forEach(tg => {
    tg.addEventListener('mouseenter', () => {
      if (isDragging && tg.dataset.tableId !== blockTableMap[block.id]) {
        tg.classList.add('block-drop-hover');
      }
    });
    tg.addEventListener('mouseleave', () => {
      tg.classList.remove('block-drop-hover');
    });
  });
}

function moveBlockToTable(blockId, newTableId) {
  const block = BLOCKS.find(b => b.id === blockId);
  if (!block) return;
  const oldTableId = blockTableMap[blockId];
  if (oldTableId === newTableId) return;

  // Move block
  const targetBlocks = BLOCKS.filter(b => blockTableMap[b.id] === newTableId);
  block.order = targetBlocks.length; // append at end
  blockTableMap[blockId] = newTableId;

  // Re-order remaining blocks in old table
  BLOCKS.filter(b => blockTableMap[b.id] === oldTableId)
        .sort((a,b) => a.order - b.order)
        .forEach((b, i) => { b.order = i; });

  // Rebuild both tables
  rebuildTableContent(oldTableId);
  rebuildTableContent(newTableId);

  renderGuestList();
  saveState();
}

// ============================================================
// DRAGGABLE TABLE GROUPS
// ============================================================
function makeDraggableTable(wrapper, tableConfig) {
  let isDragging = false;
  let startMouseX, startMouseY, startLeft, startTop;

  wrapper.addEventListener('mousedown', e => {
    const onSeat  = e.target.closest('.seat');
    const onBlock = e.target.closest('.table-block');
    if (e.button !== 0 || onSeat || onBlock) return;

    isDragging = true;
    startMouseX = e.clientX;
    startMouseY = e.clientY;
    startLeft   = parseInt(wrapper.style.left) || 0;
    startTop    = parseInt(wrapper.style.top)  || 0;
    wrapper.classList.add('dragging-table');
    e.preventDefault();
    e.stopPropagation();
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const s = getScale();
    const newLeft = Math.max(0, startLeft + (e.clientX - startMouseX) / s);
    const newTop  = Math.max(0, startTop  + (e.clientY - startMouseY) / s);
    wrapper.style.left = newLeft + 'px';
    wrapper.style.top  = newTop  + 'px';
    tableConfig.pos.left = newLeft;
    tableConfig.pos.top  = newTop;
  });

  window.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      wrapper.classList.remove('dragging-table');
    }
  });
}

// ============================================================
// MAKE SEAT
// seatKey is the full key e.g. "t3_b0-top-2"
// ============================================================
function makeSeat(seatKey, side, blockId) {
  const seat = document.createElement('div');
  seat.className = 'seat';
  seat.dataset.side = side;
  seat.dataset.seatKey = seatKey;
  seat.dataset.blockId = blockId;
  seat.id = `seat-${seatKey}`;

  const initialsEl = document.createElement('span');
  initialsEl.className = 'seat-initials';
  seat.appendChild(initialsEl);

  const tooltip = document.createElement('div');
  tooltip.className = 'seat-tooltip';
  tooltip.textContent = 'Empty';
  seat.appendChild(tooltip);

  // Drag FROM seat
  seat.addEventListener('dragstart', e => {
    const gId = seatingState[seatKey];
    if (!gId) { e.preventDefault(); return; }
    dragGuestId = gId;
    dragSourceSeatKey = seatKey;
    dropHandled = false;
    seat.classList.add('dragging-out');
    const g = guests.find(x => x.id === gId);
    const ghost = document.getElementById('dragGhost');
    ghost.textContent = g.name;
    ghost.style.display = 'block';
    e.dataTransfer.effectAllowed = 'move';
  });
  seat.addEventListener('dragend', () => {
    seat.classList.remove('dragging-out');
    document.getElementById('dragGhost').style.display = 'none';
    if (!dropHandled && dragSourceSeatKey) removeGuestFromSeat(dragSourceSeatKey);
    dragGuestId = null;
    dragSourceSeatKey = null;
    dropHandled = false;
  });

  seat.draggable = true;

  seat.addEventListener('dragover', e => { e.preventDefault(); seat.classList.add('drop-target'); });
  seat.addEventListener('dragleave', () => seat.classList.remove('drop-target'));
  seat.addEventListener('drop', e => {
    e.preventDefault();
    seat.classList.remove('drop-target');
    if (dragGuestId) {
      dropHandled = true;
      assignGuestToSeat(dragGuestId, seatKey);
    }
  });

  seat.addEventListener('contextmenu', e => {
    e.preventDefault();
    const gId = seatingState[seatKey];
    if (gId) showContextMenu(e, seatKey, gId);
  });

  return seat;
}

// ============================================================
// RENDER GUEST LIST
// ============================================================
function renderGuestList() {
  const list = document.getElementById('guestList');
  list.innerHTML = '';

  const filtered = guests.filter(g => {
    const matchSearch = g.name.toLowerCase().includes(searchTerm.toLowerCase());
    const matchFilter = activeFilter === 'all' ? true :
      activeFilter === 'seated' ? g.seated : !g.seated;
    return matchSearch && matchFilter;
  });

  // Group by suggested table
  const byTable = {};
  filtered.forEach(g => {
    if (!byTable[g.suggestedTable]) byTable[g.suggestedTable] = [];
    byTable[g.suggestedTable].push(g);
  });

  Object.entries(byTable).forEach(([tableName, gs]) => {
    const header = document.createElement('div');
    header.className = 'guest-section-header';
    header.textContent = tableName.replace('Table ', 'T').replace(' - ', ' – ');
    list.appendChild(header);

    gs.forEach(g => {
      const item = document.createElement('div');
      item.className = 'guest-item' + (g.seated ? ' seated' : '');
      item.draggable = true;
      item.dataset.guestId = g.id;

      const isVeg = g.meal.includes('Vegetarian');
      const hasAllergy = g.diet.toLowerCase().includes('allerg') ||
        g.diet.toLowerCase().includes('anaphylactic') ||
        g.diet.toLowerCase().includes('intolerance') ||
        g.diet.toLowerCase().includes('free');

      item.innerHTML = `
        <div class="guest-name">${g.name}</div>
        <div class="guest-meta">${g.seated ? '✓ Seated' : 'Unseated'}</div>
        ${g.diet ? `<span class="diet-badge ${isVeg?'veg':''} ${hasAllergy?'allergy':''}">${g.diet}</span>` : ''}
      `;

      item.addEventListener('dragstart', e => {
        dragGuestId = g.id;
        dragSourceSeatKey = null;
        dropHandled = false;
        item.classList.add('dragging');
        const ghost = document.getElementById('dragGhost');
        ghost.textContent = g.name;
        ghost.style.display = 'block';
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.getElementById('dragGhost').style.display = 'none';
        if (!dropHandled) {
          dragGuestId = null;
        }
        dropHandled = false;
      });

      list.appendChild(item);
    });
  });

  // Update stats
  const seatedCount = guests.filter(g => g.seated).length;
  document.getElementById('total-guests').textContent = guests.length;
  document.getElementById('seated-count').textContent = seatedCount;
  document.getElementById('unseated-count').textContent = guests.length - seatedCount;
}

// ============================================================
// ASSIGN / REMOVE GUESTS
// ============================================================
function assignGuestToSeat(guestId, seatKey) {
  const guest = guests.find(g => g.id === guestId);
  if (!guest) return;

  // Remember old seat so we can clear it
  const oldSeatKey = guest.seatKey;

  // Remove guest from their previous seat
  if (oldSeatKey && oldSeatKey !== seatKey) {
    seatingState[oldSeatKey] = null;
    guest.seated = false;
    guest.seatKey = null;
  }

  // If target seat already occupied, unseat that guest first
  const existingGuestId = seatingState[seatKey];
  if (existingGuestId && existingGuestId !== guestId) {
    const existingGuest = guests.find(g => g.id === existingGuestId);
    if (existingGuest) {
      existingGuest.seated = false;
      existingGuest.seatKey = null;
    }
  }

  // Place the guest
  seatingState[seatKey] = guestId;
  guest.seated = true;
  guest.seatKey = seatKey;

  // Refresh UI for affected seats
  if (oldSeatKey && oldSeatKey !== seatKey) refreshSeatUI(oldSeatKey);
  refreshSeatUI(seatKey);
  renderGuestList();
  if (activeTableId) showTableDetail(activeTableId);
}

function removeGuestFromSeat(seatKey) {
  const gId = seatingState[seatKey];
  if (!gId) return;
  const guest = guests.find(g => g.id === gId);
  if (guest) { guest.seated = false; guest.seatKey = null; }
  seatingState[seatKey] = null;
  refreshSeatUI(seatKey);
  renderGuestList();
  if (activeTableId) showTableDetail(activeTableId);
}

function refreshSeatUI(seatKey) {
  const seatEl = document.getElementById(`seat-${seatKey}`);
  if (!seatEl) return;
  const gId = seatingState[seatKey];
  const initialsEl = seatEl.querySelector('.seat-initials');
  const tooltip = seatEl.querySelector('.seat-tooltip');
  if (gId) {
    const g = guests.find(x => x.id === gId);
    seatEl.classList.add('occupied');
    seatEl.classList.remove('female', 'male');
    seatEl.classList.add(g.gender === 'f' ? 'female' : 'male');
    const nameParts = g.name.split(' ');
    initialsEl.textContent = nameParts.length >= 2
      ? nameParts[0] + '\n' + nameParts.slice(1).join(' ')
      : g.name;
    initialsEl.style.whiteSpace = 'pre';
    tooltip.textContent = g.name + (g.diet ? ` · ${g.diet}` : '');
  } else {
    seatEl.classList.remove('occupied', 'female', 'male');
    initialsEl.textContent = '';
    tooltip.textContent = 'Empty';
  }
}

// ============================================================
// TABLE DETAIL PANEL
// ============================================================
function showTableDetail(tableId) {
  activeTableId = tableId;
  const tbl = TABLES.find(t => t.id === tableId);
  const content = document.getElementById('detailContent');

  // Get all seat keys belonging to this table (via blocks)
  const tableBlocks = BLOCKS.filter(b => blockTableMap[b.id] === tableId);
  const tableSeats = tableBlocks.flatMap(b =>
    Object.keys(seatingState).filter(k => k.startsWith(b.id + '-'))
  );
  const total    = tableSeats.length;
  const occupied = tableSeats.filter(k => seatingState[k]).length;

  let html = `<div class="table-detail-header">
    <h3>${tbl.label}</h3>
    <p>${occupied} / ${total} seats filled</p>
  </div>
  <div style="padding:8px 12px;border-bottom:1px solid var(--light);">
    <button id="clearTableBtn" style="
      width:100%;padding:5px 0;font-size:0.7rem;
      border:1px solid var(--dusty-rose);border-radius:5px;
      background:transparent;color:var(--dusty-rose);
      cursor:pointer;font-family:'DM Sans',sans-serif;
      transition:all 0.12s;
    ">Clear all seats at this table</button>
  </div>
  <div class="seated-list">`;

  tableSeats.forEach(k => {
    const gId = seatingState[k];
    if (!gId) return;
    const g = guests.find(x => x.id === gId);
    html += `<div class="seated-person">
      <span>${g.name}</span>
      <button class="remove-btn" data-key="${k}" title="Remove">×</button>
    </div>`;
  });

  if (occupied === 0) html += '<div style="padding:12px 16px;font-size:0.75rem;color:var(--mid);font-style:italic;">No guests seated yet</div>';
  html += '</div>';
  content.innerHTML = html;

  content.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => removeGuestFromSeat(btn.dataset.key));
  });

  const clearBtn = document.getElementById('clearTableBtn');
  clearBtn.addEventListener('mouseenter', () => { clearBtn.style.background = 'var(--dusty-rose)'; clearBtn.style.color = 'white'; });
  clearBtn.addEventListener('mouseleave', () => { clearBtn.style.background = 'transparent'; clearBtn.style.color = 'var(--dusty-rose)'; });
  clearBtn.addEventListener('click', () => {
    const count = tableSeats.filter(k => seatingState[k]).length;
    if (count === 0) return;
    if (!confirm(`Remove all ${count} guests from ${tbl.label}?`)) return;
    tableSeats.filter(k => seatingState[k]).forEach(k => {
      const gId = seatingState[k];
      const g = guests.find(x => x.id === gId);
      if (g) { g.seated = false; g.seatKey = null; }
      seatingState[k] = null;
      refreshSeatUI(k);
    });
    renderGuestList();
    showTableDetail(tableId);
    saveState();
  });
}

// ============================================================
// AUTO-SEAT: pre-populate guests into their suggested tables
// ============================================================
function autoSeatGuests() {
  // ── Table 3 (t3): precise arrangement ──────────────────────
  // Blocks: t3_b0, t3_b1, t3_b2, t3_b3 (4 blocks, left end on b0, right end on b3)
  // Seat key format: {blockId}-top-{0,1,2}, {blockId}-bot-{0,1,2}, {blockId}-left, {blockId}-right
  // Full order matching previous layout:
  // top row L→R: b0-top-0..2, b1-top-0..2, b2-top-0..2, b3-top-0..2  (12 seats)
  // left end: b0-left
  // right end: b3-right
  // bot row L→R: b0-bot-0..2, b1-bot-0..2, b2-bot-0..2, b3-bot-0..2  (12 seats)
  const t3Seats = [
    't3_b0-top-0','t3_b0-top-1','t3_b0-top-2',
    't3_b1-top-0','t3_b1-top-1','t3_b1-top-2',
    't3_b2-top-0','t3_b2-top-1','t3_b2-top-2',
    't3_b3-top-0','t3_b3-top-1','t3_b3-top-2',
    't3_b0-left',
    't3_b3-right',
    't3_b0-bot-0','t3_b0-bot-1','t3_b0-bot-2',
    't3_b1-bot-0','t3_b1-bot-1','t3_b1-bot-2',
    't3_b2-bot-0','t3_b2-bot-1','t3_b2-bot-2',
    't3_b3-bot-0','t3_b3-bot-1','t3_b3-bot-2',
  ];
  const t3Names = [
    "Caroline Ferber","Ben Marshall","Jocelyne Simonet","Gérard Gay",
    "Laurence Bernard","Gabriel Soudry","Nathalie Kerfridin","David Nes",
    "Frédérica Roquebert","Xavier Rollin","Valerie Coriatt","William Assouline",
    "Luc Teboul",
    "Caroline Prati",
    "Bob Ferber","Magali Cayol","Jean-Yves Simonet","Ailsa Marshall",
    "Laurent Bernard","Christine Soudry","Laurent Kerfridin","Eugenie Nes",
    "Pierre-Olivier Roquebert","Ariane Regnier","Andreas Stein","Réjane Rollin",
  ];
  t3Names.forEach((name, i) => {
    const guest = guests.find(g => g.name === name);
    const key   = t3Seats[i];
    if (!guest || seatingState[key] === undefined) return;
    seatingState[key] = guest.id;
    guest.seated = true;
    guest.seatKey = key;
  });

  // ── All other tables: fill in guest-list order ──────────────
  const tableMap = {
    "Table 1 - Head Table":                      "t1",
    "Table 2 - La Moutonne City":                "t2",
    "Table 4 - Young Frenchies / Internationals":"t4",
    "Table 5 - Long Lost Cousins":               "t5",
    "Table 6 - Kids Corner":                     "t6",
    "Table 7 - Germans":                         "t7",
    "Table 8 - Americans":                       "t8",
  };
  guests.forEach(g => {
    if (g.seated) return;
    const tId = tableMap[g.suggestedTable];
    if (!tId) return;
    // Find first empty seat in any block belonging to this table
    const tableBlockIds = BLOCKS.filter(b => blockTableMap[b.id] === tId).map(b => b.id);
    const emptyKey = Object.keys(seatingState).find(k =>
      tableBlockIds.some(bid => k.startsWith(bid + '-')) && seatingState[k] === null
    );
    if (emptyKey) {
      seatingState[emptyKey] = g.id;
      g.seated = true;
      g.seatKey = emptyKey;
    }
  });
}


// ============================================================
// SAVE / LOAD  (localStorage)
// ============================================================
const SAVE_KEY = 'seatingChart_v1';

function saveState() {
  const saved = {};
  Object.entries(seatingState).forEach(([key, gId]) => {
    if (gId) {
      const g = guests.find(x => x.id === gId);
      if (g) saved[key] = g.name;
    }
  });
  // Also save custom table names
  const tableNames = {};
  TABLES.forEach(t => { tableNames[t.id] = t.label; });
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(saved));
    localStorage.setItem(SAVE_KEY + '_names', JSON.stringify(tableNames));
  } catch(e) {}
}

function loadState() {
  try {
    // Restore custom table names
    const namesRaw = localStorage.getItem(SAVE_KEY + '_names');
    if (namesRaw) {
      const tableNames = JSON.parse(namesRaw);
      TABLES.forEach(t => {
        if (tableNames[t.id]) t.label = tableNames[t.id];
      });
    }
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    let anyLoaded = false;
    Object.entries(saved).forEach(([key, name]) => {
      const g = guests.find(x => x.name === name);
      if (!g || seatingState[key] === undefined) return;
      if (g.seatKey) seatingState[g.seatKey] = null;
      seatingState[key] = g.id;
      g.seated = true;
      g.seatKey = key;
      anyLoaded = true;
    });
    return anyLoaded;
  } catch(e) { return false; }
}

function clearSavedState() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

// Patch assign/remove to auto-save after every change
const _origAssign = assignGuestToSeat;
assignGuestToSeat = function(guestId, seatKey) {
  _origAssign(guestId, seatKey);
  saveState();
};
const _origRemove = removeGuestFromSeat;
removeGuestFromSeat = function(seatKey) {
  _origRemove(seatKey);
  saveState();
};

// ============================================================
(function() {
  const area    = document.getElementById('floorPlanArea');
  const container = document.getElementById('floorContainer');
  const levelEl  = document.getElementById('zoomLevel');

  const MIN_SCALE = 0.3;
  const MAX_SCALE = 2.0;
  const STEP = 0.15;

  let scale = 1;
  let panX = 20;
  let panY = 20;
  let isPanning = false;
  let panStartX = 0;
  let panStartY = 0;
  let panStartPanX = 0;
  let panStartPanY = 0;

  function applyTransform() {
    container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    levelEl.textContent = Math.round(scale * 100) + '%';
  }

  function clampPan() {
    // Loose clamp — let user pan freely but not lose the map entirely
    const areaW = area.clientWidth;
    const areaH = area.clientHeight;
    const mapW  = 1660 * scale;
    const mapH  = 840  * scale;
    const margin = 100;
    panX = Math.min(panX, areaW - margin);
    panX = Math.max(panX, margin - mapW);
    panY = Math.min(panY, areaH - margin);
    panY = Math.max(panY, margin - mapH);
  }

  function zoomTo(newScale, originX, originY) {
    // originX/Y are in area coords — keep the point under cursor fixed
    const clampedScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const factor = clampedScale / scale;
    panX = originX - factor * (originX - panX);
    panY = originY - factor * (originY - panY);
    scale = clampedScale;
    clampPan();
    applyTransform();
  }

  function resetView() {
    scale = 1;
    panX = 20;
    panY = 20;
    applyTransform();
  }

  // Initial position
  applyTransform();

  // Zoom buttons
  document.getElementById('zoomIn').addEventListener('click', e => {
    e.stopPropagation();
    const cx = area.clientWidth / 2;
    const cy = area.clientHeight / 2;
    zoomTo(scale + STEP, cx, cy);
  });
  document.getElementById('zoomOut').addEventListener('click', e => {
    e.stopPropagation();
    const cx = area.clientWidth / 2;
    const cy = area.clientHeight / 2;
    zoomTo(scale - STEP, cx, cy);
  });
  document.getElementById('zoomReset').addEventListener('click', e => {
    e.stopPropagation();
    resetView();
  });

  // Buttons only — no mouse wheel zoom (wheel is reserved for normal page scroll)

  // Pan — middle mouse or left mouse on background
  area.addEventListener('mousedown', e => {
    if (e.button === 1 || (e.button === 0 && (e.target === area || e.target === container || e.target.classList.contains('floor-viewport')))) {
      isPanning = true;
      panStartX = e.clientX;
      panStartY = e.clientY;
      panStartPanX = panX;
      panStartPanY = panY;
      area.classList.add('panning');
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = panStartPanX + (e.clientX - panStartX);
    panY = panStartPanY + (e.clientY - panStartY);
    clampPan();
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    if (isPanning) {
      isPanning = false;
      area.classList.remove('panning');
    }
  });

  // Touch — pinch to zoom + drag to pan
  // Listen at document capture phase so we catch touches on any child element
  let lastTouchDist = null;
  let pinchActive = false;

  function getTouchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  function getTouchMid(e) {
    return {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
    };
  }
  function isInArea(e) {
    const rect = area.getBoundingClientRect();
    const t = e.touches[0];
    return t.clientX >= rect.left && t.clientX <= rect.right &&
           t.clientY >= rect.top  && t.clientY <= rect.bottom;
  }

  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2 && isInArea(e)) {
      pinchActive = true;
      isPanning = false;
      lastTouchDist = getTouchDist(e);
    } else if (e.touches.length === 1 && isInArea(e)) {
      isPanning = true;
      panStartX = e.touches[0].clientX;
      panStartY = e.touches[0].clientY;
      panStartPanX = panX;
      panStartPanY = panY;
    }
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (pinchActive && e.touches.length === 2) {
      e.preventDefault();
      const dist = getTouchDist(e);
      const mid  = getTouchMid(e);
      const rect = area.getBoundingClientRect();

      if (lastTouchDist && lastTouchDist > 0) {
        const rawFactor = dist / lastTouchDist;
        // 50% of raw — responsive but not hair-trigger
        const factor = 1 + (rawFactor - 1) * 0.5;
        zoomTo(scale * factor, mid.x - rect.left, mid.y - rect.top);
      }
      lastTouchDist = dist;
    } else if (isPanning && e.touches.length === 1) {
      panX = panStartPanX + (e.touches[0].clientX - panStartX);
      panY = panStartPanY + (e.touches[0].clientY - panStartY);
      clampPan();
      applyTransform();
    }
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      pinchActive = false;
      lastTouchDist = null;
    }
    if (e.touches.length === 0) isPanning = false;
  }, { passive: true });
})();
</script>
