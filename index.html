<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Seating Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f2;
    --warm-white: #fff9f0;
    --sage: #7a9e7e;
    --dusty-rose: #c4837a;
    --gold: #c9a84c;
    --deep: #2c2416;
    --mid: #6b5c3e;
    --light: #e8dcc8;
    --table-bg: #2c6e8a;
    --table-hover: #1e5470;
    --chair-color: #2c6e8a;
    --chair-seated: #7a9e7e;
    --shadow: 0 4px 24px rgba(44,36,22,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--deep);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--warm-white);
    border-bottom: 1px solid var(--light);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 100;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--deep);
    font-style: italic;
  }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 0.78rem;
    color: var(--mid);
  }

  .stat span { font-weight: 600; color: var(--deep); }

  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT PANEL - Guest List */
  .guest-panel {
    width: 260px;
    background: var(--warm-white);
    border-right: 1px solid var(--light);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--light);
    background: var(--cream);
  }

  .panel-header h2 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--mid);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .search-box {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--light);
    border-radius: 6px;
    background: var(--warm-white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    color: var(--deep);
    outline: none;
  }

  .search-box:focus { border-color: var(--sage); }

  .filter-tabs {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }

  .filter-tab {
    flex: 1;
    padding: 4px 0;
    font-size: 0.7rem;
    border: 1px solid var(--light);
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    color: var(--mid);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .filter-tab.active { background: var(--deep); color: white; border-color: var(--deep); }

  .guest-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .guest-item {
    padding: 7px 16px;
    cursor: grab;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 3px solid transparent;
    transition: all 0.12s;
    user-select: none;
  }

  .guest-item:hover { background: var(--light); border-left-color: var(--gold); }
  .guest-item.seated { opacity: 0.45; }
  .guest-item.dragging { opacity: 0.3; }

  .guest-name {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--deep);
  }

  .guest-meta {
    font-size: 0.68rem;
    color: var(--mid);
  }

  .diet-badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--light);
    color: var(--mid);
    margin-top: 2px;
  }

  .diet-badge.veg { background: #d4edda; color: #2d6a4f; }
  .diet-badge.allergy { background: #fff3cd; color: #856404; }

  /* FLOOR PLAN */
  .floor-plan-area {
    flex: 1;
    overflow: auto;
    padding: 24px;
    background: var(--cream);
    position: relative;
  }

  .floor-container {
    position: relative;
    width: 1160px;
    min-height: 650px;
    background: var(--warm-white);
    border: 1px solid var(--light);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin: 0 auto;
  }

  /* Room label */
  .room-label {
    position: absolute;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #bbb;
    font-weight: 500;
  }

  /* Dancefloor */
  .dancefloor {
    position: absolute;
    background: linear-gradient(135deg, #d4a574 0%, #c49060 50%, #b8844e 100%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
  }

  .dj-booth {
    position: absolute;
    background: var(--table-bg);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .entrance-marker {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .entrance-arrow {
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 14px solid var(--deep);
  }

  .entrance-label {
    font-size: 0.65rem;
    color: var(--mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* TABLE COMPONENT */
  .table-group {
    position: absolute;
  }

  .table-rect {
    background: var(--table-bg);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-align: center;
    padding: 4px 6px;
    line-height: 1.3;
  }

  /* SEATS */
  .seats-row {
    display: flex;
    gap: 2px;
    justify-content: center;
  }

  .seat {
    width: 20px;
    height: 20px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: var(--chair-color);
    opacity: 0.85;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    flex-shrink: 0;
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .seat.occupied {
    background: var(--chair-seated);
    opacity: 1;
  }

  .seat.highlight {
    border-color: var(--gold);
    transform: scale(1.15);
    opacity: 1;
  }

  .seat:hover {
    opacity: 1;
    transform: scale(1.1);
    border-color: var(--gold);
  }

  .seat[data-side="bottom"] {
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  }

  .seat[data-side="left"] {
    border-radius: 60% 40% 40% 60% / 50% 50% 50% 50%;
  }

  .seat[data-side="right"] {
    border-radius: 40% 60% 60% 40% / 50% 50% 50% 50%;
  }

  .seat-initials {
    font-size: 6px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.5px;
    line-height: 1;
    pointer-events: none;
    user-select: none;
    text-align: center;
    position: absolute;
  }

  /* SEAT TOOLTIP */
  .seat-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--deep);
    color: white;
    font-size: 0.68rem;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 200;
    pointer-events: none;
  }

  .seat-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: var(--deep);
  }

  .seat:hover .seat-tooltip,
  .seat.occupied:hover .seat-tooltip {
    display: block;
  }

  /* SEAT CONTEXT MENU */
  .context-menu {
    position: fixed;
    background: white;
    border: 1px solid var(--light);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    padding: 4px 0;
    z-index: 1000;
    min-width: 160px;
    display: none;
  }

  .context-menu.visible { display: block; }

  .context-menu-title {
    padding: 6px 14px;
    font-size: 0.7rem;
    color: var(--mid);
    border-bottom: 1px solid var(--light);
    font-style: italic;
  }

  .context-item {
    padding: 7px 14px;
    font-size: 0.78rem;
    cursor: pointer;
    color: var(--deep);
    transition: background 0.1s;
  }

  .context-item:hover { background: var(--light); }
  .context-item.danger { color: var(--dusty-rose); }

  /* DROP ZONE feedback */
  .seat.drop-target {
    border-color: var(--sage);
    transform: scale(1.2);
    opacity: 1;
    background: var(--sage);
  }

  /* DRAG GHOST */
  .drag-ghost {
    position: fixed;
    background: var(--deep);
    color: white;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    pointer-events: none;
    z-index: 9999;
    display: none;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  /* RIGHT PANEL - Table details */
  .detail-panel {
    width: 220px;
    background: var(--warm-white);
    border-left: 1px solid var(--light);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .detail-panel .panel-header {
    background: var(--cream);
  }

  .detail-content {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .detail-placeholder {
    padding: 20px 16px;
    text-align: center;
    color: var(--mid);
    font-size: 0.78rem;
    font-style: italic;
  }

  .table-detail-header {
    padding: 10px 16px;
    background: var(--table-bg);
    color: white;
  }

  .table-detail-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
  }

  .table-detail-header p {
    font-size: 0.7rem;
    opacity: 0.8;
    margin-top: 2px;
  }

  .seated-list {
    padding: 8px 0;
  }

  .seated-person {
    padding: 5px 16px;
    font-size: 0.75rem;
    color: var(--deep);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .seated-person .remove-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--dusty-rose);
    font-size: 0.85rem;
    line-height: 1;
    opacity: 0.6;
    transition: opacity 0.1s;
  }

  .seated-person .remove-btn:hover { opacity: 1; }

  .seat-num {
    font-size: 0.65rem;
    color: var(--mid);
    background: var(--light);
    border-radius: 3px;
    padding: 1px 4px;
    flex-shrink: 0;
  }

  /* scrollbars */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--light); border-radius: 2px; }

  .guest-section-header {
    padding: 4px 16px 2px;
    font-size: 0.63rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold);
    background: var(--cream);
    border-top: 1px solid var(--light);
    font-weight: 600;
  }
</style>
</head>

  <!-- RIGHT: Table Detail -->

</div>

<div class="drag-ghost" id="dragGhost"></div>
<div class="context-menu" id="contextMenu">
  <div class="context-menu-title" id="contextMenuTitle">Seat</div>

</div>

// ============================================================
// RENDER TABLES ON FLOOR PLAN
// ============================================================
function buildFloor() {
  const container = document.getElementById('floorContainer');

  TABLES.forEach(t => {
    const topCount = t.seatRows.top;
    const botCount = t.seatRows.bottom || 0;
    const hasSideL = t.sideSeats && t.sideSeats.left > 0;
    const hasSideR = t.sideSeats && t.sideSeats.right > 0;
    let seatIdx = 0;

    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.left = t.pos.left + 'px';
    wrapper.style.top = t.pos.top + 'px';
    wrapper.style.width = t.width + 'px';
    wrapper.dataset.tableId = t.id;

    // TOP SEATS ROW — inset by seat width if there are side seats
    const topRow = document.createElement('div');
    topRow.className = 'seats-row';
    topRow.style.marginBottom = '3px';
    if(hasSideL || hasSideR) {
      const inset = 22;
      topRow.style.marginLeft = hasSideL ? inset + 'px' : '0';
      topRow.style.marginRight = hasSideR ? inset + 'px' : '0';
    }
    for(let i = 0; i < topCount; i++) topRow.appendChild(makeSeat(t.id, seatIdx++, 'top'));
    wrapper.appendChild(topRow);

    // MIDDLE ROW: [left-side-seat?] + table + [right-side-seat?]
    const midRow = document.createElement('div');
    midRow.style.display = 'flex';
    midRow.style.alignItems = 'center';
    midRow.style.gap = '2px';

    if(hasSideL) {
      const ls = makeSeat(t.id, seatIdx++, 'left');
      ls.style.flexShrink = '0';
      midRow.appendChild(ls);
    }

    const tableRect = document.createElement('div');
    tableRect.className = 'table-rect';
    tableRect.style.flex = '1';
    tableRect.style.height = (t.tableH || 38) + 'px';
    tableRect.textContent = t.label;
    tableRect.style.cursor = 'pointer';
    tableRect.addEventListener('click', () => showTableDetail(t.id));
    midRow.appendChild(tableRect);

    if(hasSideR) {
      const rs = makeSeat(t.id, seatIdx++, 'right');
      rs.style.flexShrink = '0';
      midRow.appendChild(rs);
    }
    wrapper.appendChild(midRow);

    // BOTTOM SEATS ROW
    if(botCount > 0) {
      const botRow = document.createElement('div');
      botRow.className = 'seats-row';
      botRow.style.marginTop = '3px';
      if(hasSideL || hasSideR) {
        const inset = 22;
        botRow.style.marginLeft = hasSideL ? inset + 'px' : '0';
        botRow.style.marginRight = hasSideR ? inset + 'px' : '0';
      }
      for(let i = 0; i < botCount; i++) botRow.appendChild(makeSeat(t.id, seatIdx++, 'bottom'));
      wrapper.appendChild(botRow);
    }

    container.appendChild(wrapper);
  });
}

function makeSeat(tableId, idx, side) {
  const seat = document.createElement('div');
  seat.className = 'seat';
  seat.dataset.side = side;
  seat.dataset.tableId = tableId;
  seat.dataset.seatIdx = idx;
  seat.id = `seat-${tableId}-${idx}`;

  const initialsEl = document.createElement('span');
  initialsEl.className = 'seat-initials';
  seat.appendChild(initialsEl);

  const tooltip = document.createElement('div');
  tooltip.className = 'seat-tooltip';
  tooltip.textContent = 'Empty';
  seat.appendChild(tooltip);

  // Drag over
  seat.addEventListener('dragover', (e) => {
    e.preventDefault();
    seat.classList.add('drop-target');
  });
  seat.addEventListener('dragleave', () => seat.classList.remove('drop-target'));
  seat.addEventListener('drop', (e) => {
    e.preventDefault();
    seat.classList.remove('drop-target');
    if(dragGuestId) {
      assignGuestToSeat(dragGuestId, `${tableId}-${idx}`);
    }
  });

  // Right click
  seat.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const seatKey = `${tableId}-${idx}`;
    const gId = seatingState[seatKey];
    if(gId) showContextMenu(e, seatKey, gId);
  });

  // Click to assign (if dragging not needed)
  seat.addEventListener('click', () => {
    const seatKey = `${tableId}-${idx}`;
    if(seatingState[seatKey]) {
      showTableDetail(tableId);
    }
  });

  return seat;
}

// ============================================================
// RENDER GUEST LIST
// ============================================================
function renderGuestList() {
  const list = document.getElementById('guestList');
  list.innerHTML = '';

  const filtered = guests.filter(g => {
    const matchSearch = g.name.toLowerCase().includes(searchTerm.toLowerCase());
    const matchFilter = activeFilter === 'all' ? true :
      activeFilter === 'seated' ? g.seated : !g.seated;
    return matchSearch && matchFilter;
  });

  // Group by suggested table
  const byTable = {};
  filtered.forEach(g => {
    if(!byTable[g.suggestedTable]) byTable[g.suggestedTable] = [];
    byTable[g.suggestedTable].push(g);
  });

  Object.entries(byTable).forEach(([tableName, gs]) => {
    const header = document.createElement('div');
    header.className = 'guest-section-header';
    header.textContent = tableName.replace('Table ','T').replace(' - ','–');
    list.appendChild(header);

    gs.forEach(g => {
      const item = document.createElement('div');
      item.className = 'guest-item' + (g.seated ? ' seated' : '');
      item.draggable = true;
      item.dataset.guestId = g.id;

      const isVeg = g.meal.includes('Vegetarian');
      const hasAllergy = g.diet.toLowerCase().includes('allerg') || g.diet.toLowerCase().includes('anaphylactic') || g.diet.toLowerCase().includes('intolerance') || g.diet.toLowerCase().includes('free');

      item.innerHTML = `
        <div class="guest-name">${g.name}</div>
        <div class="guest-meta">${g.seated ? '✓ Seated' : 'Unseated'}</div>
        ${g.diet ? `<span class="diet-badge ${isVeg?'veg':''} ${hasAllergy?'allergy':''}">${g.diet}</span>` : ''}
      `;

      item.addEventListener('dragstart', (e) => {
        dragGuestId = g.id;
        item.classList.add('dragging');
        const ghost = document.getElementById('dragGhost');
        ghost.textContent = g.name;
        ghost.style.display = 'block';
        e.dataTransfer.effectAllowed = 'move';
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.getElementById('dragGhost').style.display = 'none';
        dragGuestId = null;
      });

      list.appendChild(item);
    });
  });

  if(filtered.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--mid);font-size:0.8rem;font-style:italic;">No guests found</div>';
  }

  updateStats();
}

// ============================================================
// ASSIGN / REMOVE GUEST FROM SEAT
// ============================================================
function assignGuestToSeat(guestId, seatKey) {
  const guest = guests.find(g => g.id === guestId);
  if(!guest) return;

  // Remove from old seat if any
  if(guest.seatKey) {
    seatingState[guest.seatKey] = null;
    updateSeatUI(guest.seatKey);
  }

  // If seat is occupied, move that person out
  const existingGuestId = seatingState[seatKey];
  if(existingGuestId) {
    const existing = guests.find(g => g.id === existingGuestId);
    if(existing) { existing.seated = false; existing.seatKey = null; }
  }

  seatingState[seatKey] = guestId;
  guest.seated = true;
  guest.seatKey = seatKey;

  updateSeatUI(seatKey);
  renderGuestList();
  if(activeTableId) showTableDetail(activeTableId);
}

function removeGuestFromSeat(seatKey) {
  const gId = seatingState[seatKey];
  if(!gId) return;
  const guest = guests.find(g => g.id === gId);
  if(guest) { guest.seated = false; guest.seatKey = null; }
  seatingState[seatKey] = null;
  updateSeatUI(seatKey);
  renderGuestList();
  if(activeTableId) showTableDetail(activeTableId);
}

function updateSeatUI(seatKey) {
  const [tableId, idx] = seatKey.split(/-(?=\d+$)/);
  const seatEl = document.getElementById(`seat-${tableId}-${idx}`);
  if(!seatEl) return;

  const gId = seatingState[seatKey];
  const tooltip = seatEl.querySelector('.seat-tooltip');
  const initialsEl = seatEl.querySelector('.seat-initials');

  if(gId) {
    const g = guests.find(x => x.id === gId);
    seatEl.classList.add('occupied');
    tooltip.textContent = g ? g.name : 'Occupied';
    if(initialsEl && g) {
      const parts = g.name.trim().split(/\s+/);
      const initials = parts.length >= 2
        ? parts[0][0].toUpperCase() + parts[parts.length-1][0].toUpperCase()
        : parts[0].substring(0,2).toUpperCase();
      initialsEl.textContent = initials;
    }
  } else {
    seatEl.classList.remove('occupied');
    tooltip.textContent = 'Empty';
    if(initialsEl) initialsEl.textContent = '';
  }
}

// ============================================================
// TABLE DETAIL PANEL
// ============================================================
function showTableDetail(tableId) {
  activeTableId = tableId;
  const table = TABLES.find(t => t.id === tableId);
  if(!table) return;

  const content = document.getElementById('detailContent');
  const seatedGuests = Object.entries(seatingState)
    .filter(([k,v]) => k.startsWith(tableId+'-') && v)
    .map(([k,v]) => ({ seatKey: k, seatIdx: parseInt(k.split('-').pop())+1, guest: guests.find(g=>g.id===v) }))
    .sort((a,b) => a.seatIdx - b.seatIdx);

  const totalSeats = table.seatRows.top + (table.seatRows.bottom||0) + (table.sideSeats ? table.sideSeats.left + table.sideSeats.right : 0);
  const occupied = seatedGuests.length;

  content.innerHTML = `
    <div class="table-detail-header">
      <h3>${table.label}</h3>
      <p>${occupied} / ${totalSeats} seats filled</p>
    </div>
    <div class="seated-list">
      ${seatedGuests.map(({seatKey, seatIdx, guest}) => `
        <div class="seated-person">
          <span class="seat-num">#${seatIdx}</span>
          <span style="flex:1;font-size:0.73rem">${guest.name}</span>
          <button class="remove-btn" data-seat="${seatKey}" title="Remove">✕</button>
        </div>
      `).join('')}
      ${seatedGuests.length === 0 ? '<div style="padding:12px 16px;font-size:0.75rem;color:var(--mid);font-style:italic;">No guests seated yet</div>' : ''}
    </div>
  `;

  content.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => removeGuestFromSeat(btn.dataset.seat));
  });
}

// ============================================================
// CONTEXT MENU
// ============================================================
function showContextMenu(e, seatKey, guestId) {
  const menu = document.getElementById('contextMenu');
  const g = guests.find(x => x.id === guestId);
  document.getElementById('contextMenuTitle').textContent = g ? g.name : 'Guest';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('visible');

  const removeBtn = document.getElementById('contextRemove');
  removeBtn.onclick = () => { removeGuestFromSeat(seatKey); menu.classList.remove('visible'); };
}

document.addEventListener('click', () => document.getElementById('contextMenu').classList.remove('visible'));
document.addEventListener('mousemove', (e) => {
  const ghost = document.getElementById('dragGhost');
  if(ghost.style.display === 'block') {
    ghost.style.left = (e.clientX + 12) + 'px';
    ghost.style.top = (e.clientY - 10) + 'px';
  }
});

// ============================================================
// STATS
// ============================================================
function updateStats() {
  const seated = guests.filter(g => g.seated).length;
  document.getElementById('total-guests').textContent = guests.length;
  document.getElementById('seated-count').textContent = seated;
  document.getElementById('unseated-count').textContent = guests.length - seated;
}

// ============================================================
// FILTERS & SEARCH
// ============================================================
document.getElementById('guestSearch').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderGuestList();
});

document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeFilter = tab.dataset.filter;
    renderGuestList();
  });
});

// Floor plan drop zone
document.getElementById('floorContainer').addEventListener('dragover', e => e.preventDefault());

// ============================================================
// INIT - Pre-seat guests to their suggested tables
// ============================================================
function initSeating() {
  // Map table labels to IDs
  const tableLabelMap = {};
  TABLES.forEach(t => tableLabelMap[t.label.toLowerCase()] = t.id);

  // Also create fuzzy match
  function findTableId(suggestedTable) {
    const s = suggestedTable.toLowerCase();
    for(const [label, id] of Object.entries(tableLabelMap)) {
      if(s.includes('head')) return 't1';
      if(s.includes('moutonne')) return 't2';
      if(s.includes('french warrior')) return 't3';
      if(s.includes('young')) return 't4';
      if(s.includes('long lost') || s.includes('cousins')) return 't5';
      if(s.includes('kids')) return 't6';
      if(s.includes('german')) return 't7';
      if(s.includes('american')) return 't8';
    }
    return null;
  }

  // Track seat indices per table
  const tableSeatCounters = {};
  TABLES.forEach(t => tableSeatCounters[t.id] = 0);

  guests.forEach(g => {
    const tableId = findTableId(g.suggestedTable);
    if(!tableId) return;
    const table = TABLES.find(t => t.id === tableId);
    const totalSeats = table.seatRows.top + (table.seatRows.bottom||0) + (table.sideSeats ? table.sideSeats.left + table.sideSeats.right : 0);
    const nextIdx = tableSeatCounters[tableId];
    if(nextIdx < totalSeats) {
      const seatKey = `${tableId}-${nextIdx}`;
      seatingState[seatKey] = g.id;
      g.seated = true;
      g.seatKey = seatKey;
      tableSeatCounters[tableId]++;
    }
  });

  // Update all seat UIs
  Object.entries(seatingState).forEach(([seatKey, gId]) => {
    if(gId) updateSeatUI(seatKey);
  });
}

// ============================================================
// BOOT
// ============================================================
buildFloor();
initSeating();
renderGuestList();
updateStats();
</script>
